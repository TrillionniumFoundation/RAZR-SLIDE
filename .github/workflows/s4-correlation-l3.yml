    - name: Prove INT and TERM cleanup through original supervisor and independent-session stdlib worker
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3 -B "$HOST_ROOT/service-launch.py" --signal-check "$CASE_DIR/signal-lifecycle" "$GITHUB_WORKSPACE"

        '
    - name: Set up pinned uv and identical Python patch version in every job
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.10.10
        python-version: 3.12.14
        enable-cache: false
    - name: Install S4 lock and verify all 43 versions
      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/install\" uv sync\
        \ --locked --no-cache\necho 'UV_NO_SYNC=1' >> \"$GITHUB_ENV\"\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\"\
        \ \"$CASE_DIR/Python-uv-runtime-identity\" \\\n  .venv/bin/python -B -c 'import json,os,shutil,subprocess,sys;\
        \ u=subprocess.check_output([\"uv\",\"--version\"],text=True).strip(); r={\"python_version\":sys.version,\"\
        python_executable\":sys.executable,\"python_patch\":list(sys.version_info[:3]),\"uv_version\":u,\"uv_path\"\
        :shutil.which(\"uv\"),\"uid\":os.getuid(),\"gid\":os.getgid()}; print(json.dumps(r)); assert sys.version_info[:3]==(3,12,14)\
        \ and u==\"uv 0.10.10\"'\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/environment-before-check\"\
        \ \\\n  .venv/bin/python -B tools/check_environment.py --output \"$CASE_DIR/environment-before.json\"\n\
        /usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/CAD-runtime-preflight\" \\\n  .venv/bin/python\
        \ -B -c 'import cadquery as cq, json, math; s=cq.Workplane(\"XY\").box(1,1,1).val(); v=s.Volume(); ok=s.isValid()\
        \ and math.isfinite(v) and v>0; print(json.dumps({\"cadquery_version\":cq.__version__,\"box_is_valid\":s.isValid(),\"\
        box_volume_mm3\":v,\"passed\":ok,\"physical_qualification\":False})); assert ok'\n"
    - name: Download the exact original L1 shard by immutable artifact and run identity
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ matrix.artifact_id }}
        run-id: '40210275856'
        repository: TrillionniumFoundation/RAZR-SLIDE
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/razr-s4-l3-replay-20261026/original-L1-download
    - name: Verify all original scientific input bytes without publishing runtime collections
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'VERIFY'\nimport hashlib,json,os,pathlib\nhost=pathlib.Path(os.environ['HOST_ROOT']);case=pathlib.Path(os.environ['CASE_DIR']);shard=os.environ['SHARD']\n\
        binding=json.loads((host/'l3/L3_BINDING.json').read_text());src=host/'original-L1-download'\nassert binding['run_id']==40210275856\n\
        for name,row in binding['shards'][shard]['members'].items():\n p=(src/name).resolve();assert p.is_relative_to(src.resolve())\
        \ and p.is_file() and not p.is_symlink()\n assert p.stat().st_size==row['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']\n\
        (case/'L3_INPUT_VERIFIED.json').write_text(json.dumps({'shard':shard,'verified_member_count':len(binding['shards'][shard]['members']),'verified':True},indent=2)+'\\\
        n')\nVERIFY\n"
    - name: Replay all seventy original correlated cases with complete source material and original Common thresholds
      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/replay-runner\"\
        \ \\\n .venv/bin/python -B \"$HOST_ROOT/l3/supervise_l3.py\" --shard \"$SHARD\" --output \"$CASE_DIR/replay\"\
        \ \\\n --inputs \"$HOST_ROOT/original-L1-download\" --binding \"$HOST_ROOT/l3/L3_BINDING.json\"\n"
    - name: Retain reviewed scientific records and outcome hashes only
      if: always()
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'SCIENCE'\nimport hashlib,json,os,pathlib,shutil,re\ndef hash_file(path):\n\
        \ h=hashlib.sha256()\n with path.open('rb') as f:\n  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)\n\
        \ return h.hexdigest()\ncase=pathlib.Path(os.environ['CASE_DIR']);out=case/'publish';out.mkdir(exist_ok=True)\n\
        raw=case/'replay/worker/science'\nif raw.is_dir():\n for p in raw.iterdir():\n  assert p.is_file() and not\
        \ p.is_symlink()\n  assert p.name=='report.json' or re.fullmatch(r'case-[0-9]{3}([.]json|-(input-moving|input-fixed|contact-key|contact-stop|decomposition-pin|decomposition-remainder|carrier-[0-9]+|carrier-contact-[0-9]+|sample-[0-9]+-(spring|stop|relative)|negative-contact-stop|negative-stop|negative-spring)[.]brep)',p.name)\n\
        \  shutil.copyfile(p,out/p.name)\nfor name in ['L3_SOURCE_IDENTITY.json','L3_INPUT_VERIFIED.json']:\n p=case/name\n\
        \ if p.is_file():shutil.copyfile(p,out/name)\nfor p in (case/'source/l3').glob('*'):\n if p.is_file():shutil.copyfile(p,out/p.name)\n\
        controller=case/'replay/controller.json'\nif controller.is_file():\n j=json.loads(controller.read_text());keys=['completed','worker_started','worker_exit_code','owned_child_identity_verified','source_bytes_unchanged','locked_environment_unchanged','owned_channel_descriptors_closed','reported_execution_completed','all_original_postguards_passed','limits','resource_start_refused','capacity_or_wall_stop','elapsed_seconds']\n\
        \ record={k:j.get(k) for k in keys};record['original_controller_sha256']=hash_file(controller);record['runtime_collection_publicly_republished']=False\n\
        \ (out/'CONTROLLER_OUTCOME.json').write_text(json.dumps(record,indent=2)+'\\n')\nrecords={}\nfor p in out.iterdir():\n\
        \ if p.is_file():records[p.name]={'bytes':p.stat().st_size,'sha256':hash_file(p)}\n(out/'MANIFEST.json').write_text(json.dumps(records,indent=2)+'\\\
        n')\nSCIENCE\n"
    - name: Upload scientific correlated geometry evidence allowlist only
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: S4-L3-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/razr-s4-l3-replay-20261026/l3/${{ matrix.shard }}/publish
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14

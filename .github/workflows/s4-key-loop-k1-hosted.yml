        \    for name in ('factory','readback'):\n        folder=case/name/'worker';rp=folder/'report.json'\n  \
        \      if rp.is_file():\n            r=json.loads(rp.read_text());d={k:r[k] for k in geometry_keys if k\
        \ in r}\n            if 'failure' in r:\n                d['original_failure_type']=r['failure'].split(':',1)[0]\n\

        \        receipt.update(process_started=True, owned_child_pid=child.pid)\n        while child.poll() is\
        \ None:\n            samples.write(json.dumps(resource())+'\\n'); samples.flush()\n            if time.time()\
        \ >= deadline:\n                receipt['outer_hosted_cap_reached'] = True\n                child.send_signal(signal.SIGINT)\n\
        \                try: child.wait(timeout=20)\n                except subprocess.TimeoutExpired:\n      \
        \              receipt['SIGINT_cleanup_timed_out'] = True\n                    os.killpg(child.pid, signal.SIGKILL)\n\
        \                    child.wait(timeout=5)\n                break\n            try: child.wait(timeout=min(5,\
        \ max(.05, deadline-time.time())))\n            except subprocess.TimeoutExpired: pass\n        receipt['child_exit_code']\
        \ = child.returncode\n        code = 124 if receipt['outer_hosted_cap_reached'] else child.returncode\n\
        except BaseException as exc:\n    receipt['failure'] = type(exc).__name__+': '+str(exc)\n    if child is\
        \ not None and child.poll() is None:\n        child.send_signal(signal.SIGINT)\n        try: child.wait(timeout=20)\n\
        \        except subprocess.TimeoutExpired:\n            os.killpg(child.pid, signal.SIGKILL); child.wait(timeout=5)\n\
        finally:\n    try: receipt['resource_after'] = resource()\n    except BaseException as exc:\n        receipt['resource_after']\
        \ = None\n        receipt['resource_after_error'] = type(exc).__name__+': '+str(exc)\n        code = 2\n\
        \    receipt.update(exit_code=code, finished_epoch=time.time())\n    target.with_suffix('.json').write_text(json.dumps(receipt,\
        \ indent=2)+'\\n')\nraise SystemExit(code)\nPY\ncp \"$HOST_ROOT/host-cap.py\" \"$CASE_DIR/source/host-cap.py\"\
        \ncat > \"$HOST_ROOT/service-launch.py\" <<'PY'\n\"\"\"D6 external harness: real readonly service view and\
        \ owned subreaper lifecycle.\nNo S4/original source edits; all task-owned evidence stays outside the checkout.\n\
        \"\"\"\nimport ctypes, errno, hashlib, importlib.util, json, os, pathlib, re, select, secrets, shutil, signal,\

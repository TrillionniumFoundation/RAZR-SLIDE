    - name: Set up pinned uv and identical Python patch version in every job
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.10.10
        python-version: 3.12.14
        enable-cache: false
    - name: Install S4 lock and verify all 43 versions
      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/install\" uv sync\
        \ --locked --no-cache\necho 'UV_NO_SYNC=1' >> \"$GITHUB_ENV\"\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\"\
        \ \"$CASE_DIR/Python-uv-runtime-identity\" \\\n  .venv/bin/python -B -c 'import json,os,shutil,subprocess,sys;\
        \ u=subprocess.check_output([\"uv\",\"--version\"],text=True).strip(); r={\"python_version\":sys.version,\"\
        python_executable\":sys.executable,\"python_patch\":list(sys.version_info[:3]),\"uv_version\":u,\"uv_path\"\
        :shutil.which(\"uv\"),\"uid\":os.getuid(),\"gid\":os.getgid()}; print(json.dumps(r)); assert sys.version_info[:3]==(3,12,14)\
        \ and u==\"uv 0.10.10\"'\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/environment-before-check\"\
        \ \\\n  .venv/bin/python -B tools/check_environment.py --output \"$CASE_DIR/environment-before.json\"\n\
        /usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/CAD-runtime-preflight\" \\\n  .venv/bin/python\
        \ -B -c 'import cadquery as cq, json, math; s=cq.Workplane(\"XY\").box(1,1,1).val(); v=s.Volume(); ok=s.isValid()\
        \ and math.isfinite(v) and v>0; print(json.dumps({\"cadquery_version\":cq.__version__,\"box_is_valid\":s.isValid(),\"\
        box_volume_mm3\":v,\"passed\":ok,\"physical_qualification\":False})); assert ok'\n"
    - name: Download exact original L1 E17 inputs for seven whole-material cases and saved EXTRUSION
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '12605676028'
        run-id: '40210275856'
        repository: TrillionniumFoundation/RAZR-SLIDE
        github-token: ${{ github.token }}
        merge-multiple: true
        path: ${{ runner.temp }}/razr-s4-k1-l5-cylindrical-20261026/original-L1-download
    - name: Verify exact original scientific members without exporting runtime collections
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'L5_INPUT_VERIFY'\nimport hashlib,json,os,pathlib\nhost=pathlib.Path(os.environ['HOST_ROOT']);case=pathlib.Path(os.environ['CASE_DIR']);src=(host/'original-L1-download').resolve()\n\
        b=json.loads((host/'l5/L5_ORIGINAL_SEVEN_BINDING.json').read_text());members={}\nfor row in b['original_cases']:\n\
        \ m=row['original_result'];members[m['path']]=m\n for item in row['inputs']:\n  for m in item['exports'].values():members[m['path']]=m\n\
        for item in b['original_EXTRUSION_direct_control']['original_saved_materials']:\n for m in item['exports'].values():members[m['path']]=m\n\
        for name,row in members.items():\n p=(src/name).resolve();assert p.is_relative_to(src) and p.is_file() and\
        \ not p.is_symlink()\n raw=p.read_bytes();assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']\n\
        receipt={'schema':'razr-L5-original-scientific-input-byte-check-v1','original_run_id':b['original_L1_run_id'],\n\
        \ 'original_artifact_id':b['original_E17_artifact_id'],'verified_member_count':len(members),\n 'original_whole_cases':7,'original_saved_EXTRUSION_members':4,'verified':True,'raw_runtime_exported':False}\n\
        (case/'L5_INPUT_VERIFIED.json').write_text(json.dumps(receipt,indent=2)+'\\n')\nprint(json.dumps(receipt))\n\
        L5_INPUT_VERIFY\n"

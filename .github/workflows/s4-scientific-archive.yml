name: Reviewed scientific originals to unpublished evidence archive
on:
  push:
    branches: [diagnostic/scientific-archive-20261026]
    paths:
      - .github/workflows/s4-scientific-archive.yml
      - engineering/engineering-integration-20261026/archive/**
permissions:
  contents: read
  actions: read
concurrency:
  group: razr-reviewed-scientific-draft-archive-20261026
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'TrillionniumFoundation/RAZR-SLIDE'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/s4-scientific-archive.yml
            engineering/engineering-integration-20261026/archive
      - name: Bind exact reviewed transfer code and all scientific input digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          sha256sum --check --strict <<'HASHES'
          a95a56624d6b235d7a486f6dc0593e1abd9a3abae47dd92e0930257e4756951b  engineering/engineering-integration-20261026/archive/archive_scientific_evidence.py
          f8e6f636ecc868f153588b011c26a0d21cb4786c51dca6bb1e4cae8f27ec4fda  engineering/engineering-integration-20261026/archive/SCIENTIFIC_ARCHIVE_INPUTS.json
          ed912a7d26fe92a939453038c67291cb8c37dfef3868e04a5e73a6d8ae296740  engineering/engineering-integration-20261026/archive/test_archive_integrity.py
          a47d25f20951f387ece8ec0df62a57a02325a9427f7749d6cbd52738103d4751  engineering/engineering-integration-20261026/archive/verify_k4_scope.py
          HASHES
          /usr/bin/python3 -B engineering/engineering-integration-20261026/archive/test_archive_integrity.py
      - name: Verify all original archive members then retain exact ZIP bytes in a draft
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B engineering/engineering-integration-20261026/archive/archive_scientific_evidence.py --manifest engineering/engineering-integration-20261026/archive/SCIENTIFIC_ARCHIVE_INPUTS.json --output "$RUNNER_TEMP/razr-scientific-archive"
      - name: Preserve only the bounded engineering transfer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scientific-archive-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-scientific-archive/ARCHIVE_RECEIPT.json
          if-no-files-found: error
          retention-days: 14

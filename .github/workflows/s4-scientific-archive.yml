name: Reviewed scientific originals to unpublished evidence archive
on:
  push:
    branches: [diagnostic/scientific-archive-20261026]
    paths:
      - .github/workflows/s4-scientific-archive.yml
      - engineering/engineering-integration-20261026/archive/**
permissions:
  contents: read
  actions: read
concurrency:
  group: razr-reviewed-scientific-draft-archive-20261026
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'TrillionniumFoundation/RAZR-SLIDE'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/s4-scientific-archive.yml
            engineering/engineering-integration-20261026/archive
      - name: Bind exact reviewed transfer code and all scientific input digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          sha256sum --check --strict <<'HASHES'
          b2d89e988d653168844d533db454b5a2bc45d7845e4ec0665a822243a634507f  engineering/engineering-integration-20261026/archive/archive_scientific_evidence.py
          b5fb7cd792a4901a29e4f52fcccff7f8bd38f8720029ec64f8bbfda1c7ce7854  engineering/engineering-integration-20261026/archive/SCIENTIFIC_ARCHIVE_INPUTS.json
          f19cd7196cddc12e588b6eeb170fb5e040f5dadc4d591ca511c13467671d4aca  engineering/engineering-integration-20261026/archive/test_archive_integrity.py
          HASHES
          /usr/bin/python3 -B engineering/engineering-integration-20261026/archive/test_archive_integrity.py
      - name: Verify all original archive members then retain exact ZIP bytes in a draft
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B engineering/engineering-integration-20261026/archive/archive_scientific_evidence.py --manifest engineering/engineering-integration-20261026/archive/SCIENTIFIC_ARCHIVE_INPUTS.json --output "$RUNNER_TEMP/razr-scientific-archive"
      - name: Preserve only the bounded engineering transfer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scientific-archive-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-scientific-archive/ARCHIVE_RECEIPT.json
          if-no-files-found: error
          retention-days: 14

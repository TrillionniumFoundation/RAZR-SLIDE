        \ seen=set()\n    while pid>1 and pid not in seen and len(rows)<64:\n        seen.add(pid); r=proc_identity(pid,full=False);\
        \ rows.append(r)\n        if pid==ancestor['pid']:\n            require(r['start_ticks']==ancestor['start_ticks'],\
        \ 'owned launcher PID reused')\n            return rows\n        pid=r['ppid']\n    raise RuntimeError('ready\

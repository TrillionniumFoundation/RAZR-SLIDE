      shell: bash
      run: "set -euo pipefail\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/factory-runner\"\
        \ \\\n  .venv/bin/python -B \"$HOST_ROOT/f1/supervise_f1.py\" --mode factory --pose \"$POSE\" --output \"\
        $CASE_DIR/factory\"\n/usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/readback-runner\"\
        \ \\\n  .venv/bin/python -B \"$HOST_ROOT/f1/supervise_f1.py\" --mode readback --pose \"$POSE\" --output\
        \ \"$CASE_DIR/readback\" \\\n  --report \"$CASE_DIR/factory/worker/report.json\" --l1-inputs \"$CASE_DIR/original-L1-inputs\"\
        \ --binding \"$HOST_ROOT/f1/F1_L1_BINDING.json\"\npython3 -B - <<'PY'\nimport hashlib,json,os,pathlib,collections\n\
        case=pathlib.Path(os.environ['CASE_DIR']);results={}\nfor name in ('factory','readback'):\n c=json.loads((case/name/'controller.json').read_text());path=case/name/'worker/report.json';r=json.loads(path.read_text())\n\
        \ assert c['completed'] is True and c['worker_exit_code']==0 and c['owned_child_identity_verified'] and\
        \ c['source_bytes_unchanged'] and c['locked_environment_unchanged'] and c['owned_channel_descriptors_closed']\n\
        \ assert c['limits']['wall_seconds']==1200 and c['limits']['worker_peak_RSS_MiB']==1536 and c['limits']['shared_unreclaimable_GiB']==6.8\n\
        \ assert c['result_sha256']==hashlib.sha256(path.read_bytes()).hexdigest()\n assert r['functional_source_commit']==os.environ['S4']\
        \ and r['pose']==os.environ['POSE'] and r['execution_completed'] is True\n assert r['all_unordered_pairs_present_once']\
        \ is True and r['expected_pair_count']==len(r['pairs'])==r['persisted_pair_count']==11781\n assert len(r['participant_names'])==154\
        \ and not r['evaluation_failures'] and not r['mismatches_to_factory']\n assert r['identity_before']['repository_head_at_start']==os.environ['S4']\
        \ and not r['identity_before']['worktree_status_at_start']\n assert r['identity_after']['source_bytes_and_locked_environment_unchanged']\
        \ and r['identity_after']['repository_head_at_finish']==os.environ['S4']\n assert all(r[k] is False for\
        \ k in ('complete_product_motion_proved','continuous_backlash_domain_proved','physical_qualification','candidate_go','fixture_fabrication_go','manufacturing_go','G2_pass'))\n\
        \ journal=[json.loads(x) for x in (case/name/'worker/pairs.jsonl').read_text().splitlines()];assert len(journal)==23562\n\
        \ assert [x['row'] for x in journal if x['event']=='completed']==r['pairs']\n results[name]={'report_sha256':c['result_sha256'],'seconds':r['seconds'],'pairs':11781,'finite_pose_clear':r['finite_pose_clear'],'positive_pairs':[{'a':x['a'],'b':x['b'],'common_mm3':x['common_mm3'],'rejected':x['rejected']}\
        \ for x in r['positive_pairs']], 'method_counts':dict(collections.Counter(x['method'] for x in r['pairs']))}\n\
        r=json.loads((case/'readback/worker/report.json').read_text())\nassert len(r['body_readbacks'])==154 and\
        \ all(x['passed'] for x in r['body_readbacks'].values())\nassert len(r['L1_whole_endpoint_material_comparisons'])==8\
        \ and all(x['passed'] for x in r['L1_whole_endpoint_material_comparisons'])\nassert r['native_STEP_readback_executed']\
        \ is True and r['independent_CAD_kernel'] is False\n(case/'F1-complete-observation.json').write_text(json.dumps({'source_commit':os.environ['S4'],'pose':os.environ['POSE'],'results':results,'L1_original_whole_endpoint_frames_checked':8,'all_154_STEP_bodies_independently_imported':True,'all_11781_pairs_recomputed_from_imported_STEP':True,'complete_motion_or_hardware_qualification':False},indent=2)+'\\\
        n')\nPY\n"
    - name: Preserve current hashes and failure evidence without rewriting raw reports

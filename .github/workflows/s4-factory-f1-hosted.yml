        \ dst=out/rel;dst.parent.mkdir(parents=True,exist_ok=True)\n with dst.open('xb') as f:f.write(data)\nreceipt={'run_id':binding['L1_run_id'],'artifact_id':binding['artifact_id'],'selected_member_count':len(binding['selected_original_members']),'all_selected_original_bytes_verified':True,'original_ZIP_digest_from_prior_preserved_receipt':binding['original_zip_sha256'],'original_ZIP_bytes_independently_rehashed_in_this_run':False,'note':'Pinned\

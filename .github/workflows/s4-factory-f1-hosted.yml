      shell: bash
      run: "set -euo pipefail\nenvironment_exit=not_executed\nif test -x .venv/bin/python && test -f tools/check_environment.py;\
        \ then\n  environment_exit=0\n  /usr/bin/python3 -B \"$HOST_ROOT/service-launch.py\" \"$CASE_DIR/environment-after-check\"\
        \ \\\n    .venv/bin/python -B tools/check_environment.py --output \"$CASE_DIR/environment-after.json\" ||\
        \ environment_exit=$?\nfi\necho \"$environment_exit\" > \"$CASE_DIR/environment-after.exit-code.txt\"\n\
        python3 -B - <<'PY'\nimport hashlib, json, os, pathlib, subprocess\ncase = pathlib.Path(os.environ['CASE_DIR'])\n\
        def git(*args):\n    p = subprocess.run(['git', *args], text=True, capture_output=True)\n    return {'exit_code':\
        \ p.returncode, 'stdout': p.stdout, 'stderr': p.stderr}\nsource = {'head': git('rev-parse', 'HEAD'), 'status':\
        \ git('status', '--porcelain', '--untracked-files=all')}\nif (case/'source-identity.json').is_file():\n\
        \    r = json.loads((case/'source-identity.json').read_text())\n    source['original_five_sources_unchanged']\
        \ = all(\n      (pathlib.Path(r['study_directory'])/name).is_file() and\n      hashlib.sha256((pathlib.Path(r['study_directory'])/name).read_bytes()).hexdigest()\
        \ == digest\n      for name, digest in r['study_source_sha256'].items())\n(case/'source-after.json').write_text(json.dumps(source,\
        \ indent=2)+'\\n')\nenvironment_file = case/'environment-after.json'\nenvironment_code = (case/'environment-after.exit-code.txt').read_text().strip()\n\
        environment_passed = environment_file.is_file() and environment_code == '0' and json.loads(environment_file.read_text()).get('passed')\
        \ is True\n(case/'environment-after-state.json').write_text(json.dumps({'status': 'passed' if environment_passed\
        \ else 'failed' if environment_file.is_file() else 'not_executed', 'wrapper_exit_code': environment_code,\
        \ 'checker_report_exists': environment_file.is_file(), 'passed': environment_passed}, indent=2)+'\\n')\n\
        if (case/'S4-source-before.json').is_file():\n    before = json.loads((case/'S4-source-before.json').read_text())\n\
        \    root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()\n    current={rel:hashlib.sha256((root/rel).read_bytes()).hexdigest()\
        \ if (root/rel).is_file() and not (root/rel).is_symlink() else None for rel in before['present_source_sha256']}\n\
        \    unchanged=current==before['present_source_sha256']\n    after={'source_commit':os.environ['S4'],'all_present_source_bytes_unchanged':unchanged,'changed':[rel\
        \ for rel in current if current[rel]!=before['present_source_sha256'][rel]],'source_sha256_after':current,'previous_C2_test_pass_reused':False}\n\
        \    (case/'S4-source-after.json').write_text(json.dumps(after,indent=2)+'\\n')\nmembers = {str(p.relative_to(case)):\
        \ {'bytes': p.stat().st_size,\n  'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}\n  for p in sorted(case.rglob('*'))\
        \ if p.is_file() and p != case/'host-artifact-manifest.json'}\n(case/'host-artifact-manifest.json').write_text(json.dumps({'members':\
        \ members}, indent=2)+'\\n')\nassert source['head']['exit_code'] == 0 and source['head']['stdout'].strip()\
        \ == os.environ['S4']\nassert source['status']['exit_code'] == 0 and not source['status']['stdout'].strip()\n\
        assert source.get('original_five_sources_unchanged') is True\nassert (case/'environment-after.exit-code.txt').read_text().strip()\
        \ == '0'\nassert json.loads((case/'environment-after.json').read_text()).get('passed') is True\nPY\ntest\
        \ -f \"$CASE_DIR/S4-source-after.json\"\npython3 -B -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ[\"\
        CASE_DIR\"])/\"S4-source-after.json\").read_text())[\"all_present_source_bytes_unchanged\"] is True'\n"
    - name: Export only explicit engineering originals and marked projections; leave raw runtime on ephemeral runner
      if: always()
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$CASE_DIR/source/f1\"\ncat > \"$CASE_DIR/source/f1/export_f1_engineering.py\"\
        \ <<'F1_ENGINEERING_EXPORT'\n\"\"\"Export an explicit engineering evidence allowlist without altering raw\
        \ results.\n\nThe original runtime remains on the ephemeral runner. Omitted runtime bytes are\nhashed locally;\
        \ this exporter does not claim their durable preservation.\n\"\"\"\nfrom __future__ import annotations\n\
        import argparse\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport shutil\n\
        \nS4 = 'dd7def6e6a4de9f47dc91ca2ab336fb1a8828560'\nOLD_ROOT = '/home/runner/work/RAZR-SLIDE/RAZR-SLIDE/'\n\
        \ndef sha(path):\n    with Path(path).open('rb') as f:\n        return hashlib.file_digest(f, 'sha256').hexdigest()\n\
        \ndef main():\n    ap=argparse.ArgumentParser(description=__doc__)\n    ap.add_argument('--case',type=Path,required=True)\n\
        \    ap.add_argument('--output',type=Path,required=True)\n    args=ap.parse_args();case=args.case.resolve();out=args.output.resolve()\n\
        \    root=Path(os.environ['GITHUB_WORKSPACE']).resolve()\n    if not case.is_dir() or out.exists() or out.is_relative_to(case):\n\
        \        raise ValueError('existing raw case and fresh separate export required')\n    out.mkdir(parents=True);copied={};projected={};checks={};known_originals=set()\n\
        \n    def normal(value):\n        if isinstance(value,str):\n            for prefix in (str(root)+'/',OLD_ROOT):\n\
        \                value=value.replace(prefix,'repository/')\n            if re.search(r'(?:/home/|/tmp/|/workspace/|oai-library:|library-file:|libfile_|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\
        .[A-Za-z]{2,})',value):\n                raise ValueError('non-engineering locator in projected evidence')\n\
        \            return value\n        if isinstance(value,list):return [normal(x) for x in value]\n       \
        \ if isinstance(value,dict):return {normal(k):normal(v) for k,v in value.items()}\n        return value\n\
        \n    def write(rel,value):\n        p=out/rel;p.parent.mkdir(parents=True,exist_ok=True)\n        p.write_text(json.dumps(normal(value),indent=2,allow_nan=False)+'\\\
        n')\n\n    def source_ref(p):\n        return {'sha256':sha(p),'bytes':p.stat().st_size}\n\n    def copy(p,rel=None):\n\
        \        if p.is_symlink() or not p.is_file() or not p.resolve().is_relative_to(case):\n            raise\
        \ ValueError('nonregular or escaping engineering input')\n        rel=rel or str(p.relative_to(case));dst=out/rel;dst.parent.mkdir(parents=True,exist_ok=True)\n\

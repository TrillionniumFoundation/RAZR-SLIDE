name: EC1a original S4 KiCad checks with isolated loader diagnosis
'on':
  push:
    branches:
    - diagnostic/s4-ecad-ec1a-20261026
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ec1a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ecad:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Checkout immutable functional S4
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dd7def6e6a4de9f47dc91ca2ab336fb1a8828560
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: '/tools/verify_ep5_ecad_native.py

          /tools/read_ep5_ecad_native.py

          /integration/product_ep5_ecad.py

          /integration/product_interfaces.py

          /design/product_routing_ep5.json

          '
    - name: Prepare byte-identical EC1 driver and bounded diagnostic projection
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/razr-ec1-source\"\ncat > \"$RUNNER_TEMP/razr-ec1-source/run_ec1.py\"\
        \ <<'RAZR_EC1_SOURCE'\n\"\"\"Execute the unmodified S4 native KiCad verifier with pinned isolated packages.\"\
        \"\"\nfrom pathlib import Path\nimport concurrent.futures\nimport hashlib\nimport json\nimport os\nimport\
        \ subprocess\nimport sys\nimport time\nimport urllib.request\n\nS4 = 'dd7def6e6a4de9f47dc91ca2ab336fb1a8828560'\n\
        SOURCES = ('tools/verify_ep5_ecad_native.py', 'tools/read_ep5_ecad_native.py',\n           'integration/product_ep5_ecad.py',\
        \ 'integration/product_interfaces.py',\n           'design/product_routing_ep5.json')\n\ndef sha(path):\n\
        \    with Path(path).open('rb') as stream:\n        digest = hashlib.sha256()\n        for block in iter(lambda:\
        \ stream.read(1024 * 1024), b''):\n            digest.update(block)\n        return digest.hexdigest()\n\
        \ndef main():\n    repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()\n    base = Path(os.environ['RUNNER_TEMP'])\
        \ / 'razr-ec1-s4'\n    base.mkdir(exist_ok=False)\n    output = base / 'result'\n    packages = json.loads(Path(sys.argv[1]).read_text())['packages']\n\
        \    receipt = {'schema': 'razr-S4-EC1-launch-v1', 'source_commit': S4,\n               'started': time.time(),\
        \ 'completed': False, 'passed': False,\n               'new_native_execution': False, 'source_sha256': {},\
        \ 'packages': [],\n               'candidate_go': False, 'fixture_fabrication_go': False,\n            \
        \   'manufacturing_go': False}\n    try:\n        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'],\
        \ cwd=repo, text=True).strip() == S4\n        assert not subprocess.check_output(['git', 'status', '--porcelain',\
        \ '--untracked-files=all'], cwd=repo, text=True)\n        for name in SOURCES:\n            actual = (repo\
        \ / name).read_bytes()\n            assert actual == subprocess.check_output(['git', 'show', S4 + ':' +\
        \ name], cwd=repo)\n            receipt['source_sha256'][name] = hashlib.sha256(actual).hexdigest()\n  \
        \      cache = base / 'downloads'\n        cache.mkdir()\n        def fetch(row):\n            target =\
        \ cache / row['name']\n            assert Path(row['name']).name == row['name']\n            assert row['url'].startswith(('https://archive.ubuntu.com/ubuntu/',\
        \ 'https://ppa.launchpadcontent.net/kicad/'))\n            with urllib.request.urlopen(row['url'], timeout=90)\
        \ as source, target.open('xb') as dest:\n                while block := source.read(1024 * 1024):\n    \
        \                dest.write(block)\n            if target.stat().st_size != row['bytes'] or sha(target)\
        \ != row['sha256']:\n                raise ValueError('pinned package bytes differ: ' + row['name'])\n \
        \           return {**row, 'verified': True}\n        with concurrent.futures.ThreadPoolExecutor(max_workers=4)\
        \ as pool:\n            receipt['packages'] = list(pool.map(fetch, packages))\n        runtime = base /\
        \ 'runtime'\n        runtime.mkdir()\n        for row in packages:\n            subprocess.run(['dpkg-deb',\
        \ '-x', str(cache / row['name']), str(runtime)], check=True, timeout=60)\n        env = os.environ.copy()\n\
        \        env['PYTHONDONTWRITEBYTECODE'] = '1'\n        env['LD_LIBRARY_PATH'] = ':'.join(str(runtime / p)\
        \ for p in ('usr/lib/x86_64-linux-gnu', 'usr/lib'))\n        env['PYTHONPATH'] = str(runtime / 'usr/lib/python3/dist-packages')\n\
        \        env['KICAD_STOCK_DATA_HOME'] = str(runtime / 'usr/share/kicad')\n        for name, folder in [('KICAD_CONFIG_HOME',\
        \ 'config'), ('KICAD_DOCUMENTS_HOME', 'documents'),\n                             ('XDG_CONFIG_HOME', 'xdg-config'),\
        \ ('XDG_CACHE_HOME', 'xdg-cache'),\n                             ('XDG_DATA_HOME', 'xdg-data')]:\n     \
        \       directory = base / folder\n            directory.mkdir()\n            env[name] = str(directory)\n\
        \        command = ['/usr/bin/python3', '-B', str(repo / SOURCES[0]), '--output', str(output),\n       \
        \            '--expected-head', S4, '--kicad-python', '/usr/bin/python3',\n                   '--kicad-cli',\
        \ str(runtime / 'usr/bin/kicad-cli')]\n        with (base / 'verifier.log').open('x') as log:\n        \
        \    result = subprocess.run(command, cwd=repo, env=env, stdout=log,\n                                 \
        \   stderr=subprocess.STDOUT, timeout=930)\n        receipt['verifier_exit_code'] = result.returncode\n\
        \        receipt['verifier_report_produced'] = (output / 'report.json').is_file()\n        if receipt['verifier_report_produced']:\n\
        \            report = json.loads((output / 'report.json').read_text())\n            receipt['new_native_execution']\
        \ = any(c.get('label') in ('native-readback', 'native-drc')\n                and isinstance(c.get('exit_code'),\
        \ int) for c in report.get('commands', []))\n            receipt['native_DRC_executed'] = report.get('native_DRC_executed',\
        \ False)\n            receipt['passed'] = result.returncode == 0 and report.get('passed') is True\n    \
        \    receipt['completed'] = True\n    except Exception as exc:\n        receipt['error_type'] = type(exc).__name__\n\
        \        receipt['error_message'] = str(exc)\n    finally:\n        receipt['elapsed_seconds'] = time.time()\
        \ - receipt['started']\n        receipt['source_bytes_unchanged'] = all(sha(repo / n) == h for n, h in receipt['source_sha256'].items())\n\
        \        receipt['passed'] = receipt['passed'] and receipt['source_bytes_unchanged']\n        (base / 'execution.json').write_text(json.dumps(receipt,\
        \ indent=2) + '\\n')\n    return 0 if receipt['passed'] else 1\n\nif __name__ == '__main__':\n    raise\
        \ SystemExit(main())\nRAZR_EC1_SOURCE\ncat > \"$RUNNER_TEMP/razr-ec1-source/export_ec1.py\" <<'RAZR_EC1_SOURCE'\n\
        \"\"\"Retain scientific ECAD outputs and explicit engineering projections only.\"\"\"\nfrom pathlib import\
        \ Path\nimport hashlib\nimport json\nimport os\nimport re\nimport shutil\n\ndef sha(path):\n    with Path(path).open('rb')\
        \ as f:\n        digest = hashlib.sha256()\n        for block in iter(lambda: f.read(1024 * 1024), b''):\n\
        \            digest.update(block)\n        return digest.hexdigest()\n\nALLOWED = {\n    'execution.json':\
        \ '''schema source_commit completed passed new_native_execution verifier_report_produced\n        source_sha256\
        \ packages candidate_go fixture_fabrication_go manufacturing_go verifier_exit_code\n        native_DRC_executed\
        \ elapsed_seconds source_bytes_unchanged error_type'''.split(),\n    'result/report.json': '''schema expected_head\
        \ passed native_DRC_executed schematic_ERC_executed\n        schematic_parity_requested OEM_assignment_qualified\
        \ signal_integrity_or_power_qualified\n        dynamic_FPC_qualified supplier_stackup_selected candidate_go\
        \ fixture_fabrication_go manufacturing_go\n        scope source_sha256_before artwork_report_sha256 candidate_id\
        \ native_readback kicad_version kicad_release\n        native_DRC_sha256 native_DRC_counts input_board_project_bytes_unchanged\
        \ source_sha256_after\n        source_bytes_unchanged source_head_after files_sha256 seconds'''.split(),\n\
        \    'result/native-drc.json': '''$schema coordinate_units date included_severities kicad_version\n    \
        \    schematic_parity source unconnected_items violations'''.split(),\n    'result/native-readback/readback.json':\
        \ '''scope kicad_version kicad_release source_sha256 inputs_sha256\n        project_loaded input_bytes_unchanged\
        \ seconds tracks declared_board_thickness_mm footprints native_pad_objects\n        unique_connected_terminals\
        \ electrical_nets drc_sections drc_violation_types drc_zero_reported_items\n        drc_report_sha256 exported_footprints\
        \ native_pad_readback product_motion_or_OEM_qualification'''.split(),\n}\n\ndef main():\n    base = Path(os.environ['RUNNER_TEMP'])\
        \ / 'razr-ec1-s4'\n    root = Path(os.environ['GITHUB_WORKSPACE']).resolve()\n    out = Path(os.environ['RUNNER_TEMP'])\
        \ / 'razr-ec1-engineering'\n    out.mkdir(exist_ok=False)\n    manifest = {'schema': 'razr-EC1-engineering-export-v1',\
        \ 'raw_runtime_exported': False,\n                'raw_runtime_durable': False, 'original_producer_records_modified':\
        \ False,\n                'source_commit': 'dd7def6e6a4de9f47dc91ca2ab336fb1a8828560', 'files': {}}\n  \
        \  for name in ['artwork/ep5_continuity26.kicad_pcb', 'artwork/ep5_continuity26.kicad_pro',\n          \
        \       'artwork/conductor-schedule.csv', 'artwork/flat-material-outline.json', 'artwork/fp-lib-table']:\n\
        \        source = base / 'result' / name\n        if source.is_file() and not source.is_symlink():\n   \
        \         target = out / name\n            target.parent.mkdir(parents=True, exist_ok=True)\n          \
        \  shutil.copyfile(source, target)\n            manifest['files'][name] = {'sha256': sha(source), 'bytes':\
        \ source.stat().st_size, 'original_bytes': True}\n    def normalize(value):\n        if isinstance(value,\
        \ str):\n            value = value.replace(str(root), 'repository').replace(str(base), 'task-evidence')\n\
        \            if (any(p in value for p in ('/home/', '/workspace/', '/tmp/', 'libfile_', 'oai-library:'))\n\
        \                    or re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}', value)):\n       \
        \         raise ValueError('unexpected runtime locator in engineering projection')\n            return value\n\
        \        if isinstance(value, list):\n            return [normalize(v) for v in value]\n        if isinstance(value,\
        \ dict):\n            return {normalize(k): normalize(v) for k, v in value.items()}\n        return value\n\
        \    for name in ['execution.json', 'result/report.json', 'result/native-drc.json', 'result/native-readback/readback.json']:\n\
        \        source = base / name\n        if not source.is_file():\n            continue\n        record =\
        \ json.loads(source.read_text())\n        selected = {k: record[k] for k in ALLOWED[name] if k in record}\n\
        \        if isinstance(record.get('error'), dict):\n            selected['error_type'] = record['error'].get('type')\n\
        \        payload = {'schema': 'razr-EC1-derived-engineering-projection-v1', 'is_original_record': False,\n\
        \                   'original_sha256': sha(source), 'original_bytes': source.stat().st_size,\n         \
        \          'raw_runtime_durable': False, 'engineering_record': normalize(selected)}\n        destname =\
        \ name.replace('.json', '.engineering.json')\n        target = out / destname\n        target.parent.mkdir(parents=True,\
        \ exist_ok=True)\n        target.write_text(json.dumps(payload, indent=2) + '\\n')\n        manifest['files'][destname]\
        \ = {'sha256': sha(target), 'bytes': target.stat().st_size, 'original_bytes': False}\n    (out / 'MANIFEST.json').write_text(json.dumps(manifest,\
        \ indent=2) + '\\n')\n\nif __name__ == '__main__':\n    main()\nRAZR_EC1_SOURCE\ncat > \"$RUNNER_TEMP/razr-ec1-source/EC1_PINNED_PACKAGES.json\"\

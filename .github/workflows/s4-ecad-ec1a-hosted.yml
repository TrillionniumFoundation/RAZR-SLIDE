        \ code = None\n    status = 'completed'\n    with output.open('xb') as stream:\n        try:\n         \
        \   proc = subprocess.run(command, env=env, stdout=stream, stderr=subprocess.STDOUT, timeout=15)\n     \
        \       code = proc.returncode\n        except subprocess.TimeoutExpired:\n            status = 'timeout'\n\

        \        raw = version_path.read_bytes()\n        if len(raw) <= LIMIT_BYTES:\n            result['original_version']\
        \ = classify_version(raw, (version_command or {}).get('exit_code'))\n            result['original_version_matches_command_hash']\
        \ = (version_command or {}).get('log_sha256') == digest(raw)\n    runtime = base / 'runtime'\n    cli =\
        \ runtime / 'usr/bin/kicad-cli'\n    if not cli.is_file():\n        result['diagnostic_state'] = 'runtime_not_prepared'\n\
        \        return result\n    env = os.environ.copy()\n    env['PYTHONDONTWRITEBYTECODE'] = '1'\n    env['LD_LIBRARY_PATH']\

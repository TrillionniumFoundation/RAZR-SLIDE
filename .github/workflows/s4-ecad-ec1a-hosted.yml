        \n\ndef classify_version(data, exit_code):\n    \"\"\"Extract narrowly specified loader syntax; never export\
        \ arbitrary tokens.\"\"\"\n    text = data.decode('utf-8', 'replace')\n    missing = sorted(set(re.findall(\n\
        \        r'error while loading shared libraries: (' + LIBRARY + r'):'\n        r' cannot open shared object\
        \ file: No such file or directory', text)))\n    versions = sorted(set(re.findall(r'(?m)^([0-9]{1,3}\\.[0-9]{1,3}\\\
        .[0-9]{1,3})\\r?$', text)))\n    abi = sorted(set(re.findall(\n        r\"version [`']((?:GLIBC|GLIBCXX|CXXABI|GCC|OPENSSL)_[0-9][0-9.]*)['`]\
        \ not found\", text)))\n    if missing:\n        category = 'loader_missing_library'\n    elif abi:\n  \
        \      category = 'loader_missing_symbol_version'\n    elif 'symbol lookup error:' in text or 'undefined\
        \ symbol:' in text:\n        category = 'loader_undefined_symbol'\n    elif exit_code == 0 and len(versions)\
        \ == 1:\n        category = 'version_executed'\n    elif type(exit_code) is int and exit_code < 0:\n   \
        \     category = 'process_signal'\n    elif exit_code == 0:\n        category = 'unrecognized_success_output'\n\
        \    else:\n        category = 'unclassified_version_failure'\n    return {'classification': category, 'exit_code':\
        \ exit_code,\n            'numeric_versions': versions, 'missing_libraries': missing,\n            'missing_ABI_versions':\
        \ abi, 'raw_record': describe(data),\n            'raw_text_exported': False}\n\n\ndef project_ldd(data,\
        \ exit_code):\n    text = data.decode('utf-8', 'replace')\n    dependencies = {}\n    unknown = 0\n    non_dynamic\
        \ = False\n    for line in text.splitlines():\n        line = line.strip()\n        if not line:\n     \

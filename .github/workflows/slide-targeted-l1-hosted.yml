        class Observer:
            """Read-only Python trace; shape references are exported after the call."""
            SHAPE_NAMES = ('shape', 'node', 'face', 'body', 'piece', 'moved', 'a', 'b', 'region',
                           'carrier', 'first', 'last', 'bridge', 'swept')
            SCALAR_NAMES = ('v', 'value', 'kind', 'i', 'index', 'lo', 'hi', 'radius', 'height',
                            'vector', 'move', 'axis', 'base', 'start', 'coefficients', 'domain',
                            'bounds', 'aa', 'bb', 'shift', 'swept', 'high', 'maximum', 'values', 'upper')
            def __init__(self, root):
                self.files = {str((root/'integration'/name).resolve()) for name in
                              ('product_nominal_motion.py', 'product_assembly.py', 'translation_regions.py', 'straight_envelope.py')}
                self.events, self.frames, self.commons, self.failures = [], [], [], []
                self.materials, self.material_ids = [], {}
                self.frame_ids, self.strict, self.volumes, self.exceptions = {}, {}, {}, []
        
            def capture(self, shape, role, context):
                if not (hasattr(shape, 'wrapped') and hasattr(shape, 'ShapeType') and hasattr(shape, 'Volume')):
                    return None
                key = id(shape)
                if key not in self.material_ids:
                    index = len(self.materials)+1
                    self.material_ids[key] = index
                    self.materials.append({'id': index, 'shape': shape, 'references': []})
                index = self.material_ids[key]
                self.materials[index-1]['references'].append({'role': role, **context})
                return index
        
            def context(self, frame):
                current = frame
                while current is not None:
                    if id(current) in self.frame_ids:
                        return {'native_reference_frame_index': self.frame_ids[id(current)]}
                    current = current.f_back
                return {'native_reference_frame_index': None}
        
            def trace(self, frame, event, arg):
                if frame.f_code.co_filename not in self.files:
                    return None
                frame.f_trace_lines = False
                try:
                    name = frame.f_code.co_name
                    context = {**self.context(frame), 'source': frame.f_code.co_filename,
                               'function': name, 'line': frame.f_lineno}
                    if event == 'call':
                        if name == '_continuous_pair_in_frame':
                            self.frame_ids[id(frame)] = len(self.frames)+1
                            self.frames.append({'native_reference_frame_index': len(self.frames)+1,
                                                'coefficients': safe(frame.f_locals['coefficients']),
                                                'domain': safe(frame.f_locals['domain'])})
                        if name == 'strict_common':
                            self.strict[id(frame)] = {'volume_calls': 0, 'index': len(self.commons)+1}
                            self.commons.append({**context, 'strict_common_index': len(self.commons)+1})
                        if name == 'volume' and frame.f_back is not None and id(frame.f_back) in self.strict:
                            strict = self.strict[id(frame.f_back)]; strict['volume_calls'] += 1
                            if strict['volume_calls'] == 1:
                                self.volumes[id(frame)] = {'shape': frame.f_locals['shape'], 'index': strict['index'], 'exception': False}
                    elif event == 'exception':
                        etype, exc, tb = arg
                        try:
                            exc_index = next(i+1 for i, item in enumerate(self.exceptions) if item is exc)
                        except StopIteration:
                            self.exceptions.append(exc); exc_index = len(self.exceptions)
                        item = {**context, 'native_exception_index': exc_index, 'type': etype.__name__, 'message': str(exc),
                                'traceback': ''.join(traceback.format_exception(etype, exc, tb)),
                                'locals': {k: snapshot_locals(frame.f_locals[k]) for k in self.SCALAR_NAMES if k in frame.f_locals},
                                'material_ids': {}}
                        for key in self.SHAPE_NAMES:
                            if key in frame.f_locals:
                                index = self.capture(frame.f_locals[key], 'exception-local-'+key, context)
                                if index is not None:
                                    item['material_ids'][key] = index
                        self.events.append(item)
                        if id(frame) in self.volumes:
                            volume = self.volumes[id(frame)]; volume['exception'] = True
                            index = self.capture(volume['shape'], 'actual-Common-before-volume-failure', context)
                            self.commons[volume['index']-1].update(volume_evaluation_failure=exception_record(exc), actual_Common_material_id=index)
                    elif event == 'return':
                        if id(frame) in self.volumes:
                            volume = self.volumes.pop(id(frame))
                            if not volume['exception']:
                                row = self.commons[volume['index']-1]
                                row['actual_Common_signed_volume_mm3'] = safe(arg)
                                if type(arg) not in (int, float) or arg != 0:
                                    row['actual_Common_material_id'] = self.capture(volume['shape'], 'actual-nonzero-Common', context)
                        if name == 'strict_common' and id(frame) in self.strict:
                            row = self.strict.pop(id(frame)); self.commons[row['index']-1]['original_return'] = safe(arg)
                        if name == '_continuous_pair_in_frame' and id(frame) in self.frame_ids:
                            index = self.frame_ids.pop(id(frame)); row = self.frames[index-1]; row['original_return'] = safe(arg)
                            row['observed_region_values_mm3'] = safe(frame.f_locals.get('values'))
                            if isinstance(arg, dict) and arg.get('disposition') != 'clear' and 'region' in frame.f_locals:
                                row['last_examined_region_material_id'] = self.capture(frame.f_locals['region'], 'last-examined-enclosure-region', context)
                    return self.trace
                except BaseException as exc:
                    self.failures.append({'event': event, 'source': frame.f_code.co_filename,
                                          'function': frame.f_code.co_name, **exception_record(exc)})
                    return self.trace
        
            def record(self):
                require(sys.gettrace() is None, 'trace must be detached before native metadata observation')
                return safe({'exception_events': self.events, 'distinct_native_exception_count': len(self.exceptions),
                        'native_frame_results': self.frames, 'actual_strict_Common_calls': self.commons,
                        'observer_failures': self.failures,
                        'captured_materials': [{'id': m['id'], 'references': m['references']} for m in self.materials],
                        'original_functions_replaced': False, 'source_functions_mutated': False,
                        'sys_settrace_observation_only': True})
        
        
        def shape_signature(shape):
            result = {}
            for key, call in [('shape_type', shape.ShapeType), ('is_valid', shape.isValid),
                              ('signed_volume_mm3', shape.Volume),
                              ('solid_signed_volumes_mm3', lambda: [s.Volume() for s in shape.Solids()]),
                              ('top_level_children_types', lambda: [s.ShapeType() for s in shape] if shape.ShapeType() in ('Compound', 'CompSolid') else [])]:
                try:
                    result[key] = safe(call())
                except Exception as exc:
                    result[key+'_failure'] = exception_record(exc)
            return result
        
        
        def export_material(material, folder, budget):
            shape = material['shape']; result = {'id': material['id'], 'references': material['references'],
                'original_in_memory_signature': shape_signature(shape), 'exports': {},
                'invalid_or_nonpositive_topology_is_preserved_as_diagnostic_evidence': True}
            for extension, method in [('brep', shape.exportBrep), ('step', shape.exportStep)]:
                budget.check(); path = folder/('material-'+str(material['id']).zfill(3)+'.'+extension)
                status = None
                try:
                    status = method(str(path))
                    expected_STEP_status = getattr(type(status), 'IFSelect_RetDone', None)
                    require(status is True if extension == 'brep' else expected_STEP_status is not None and status == expected_STEP_status,
                            'native export status did not indicate success')
                    require(path.is_file() and path.stat().st_size > 0, 'native export did not produce material bytes')
                    result['exports'][extension] = {'path': path.name, 'bytes': path.stat().st_size, 'sha256': sha(path),
                                                     'native_export_status': str(status)}
                except Exception as exc:
                    result['exports'][extension] = {'export_failure': exception_record(exc), 'native_export_status': str(status),
                            'partial_file': {'bytes': path.stat().st_size, 'sha256': sha(path)} if path.is_file() else None}
            result['after_export_in_memory_signature'] = shape_signature(shape)
            result['signature_unchanged_by_serialization'] = result['after_export_in_memory_signature'] == result['original_in_memory_signature']
            return result
        
        

        def safe(value):
            """Observation encoding only: preserve nonfinite numbers explicitly."""
            if value is None or type(value) in (bool, int, str):
                return value
            if type(value) is float:
                return value if math.isfinite(value) else {'nonfinite_float_repr': repr(value)}
            if isinstance(value, Fraction):
                return str(value)
            if isinstance(value, (list, tuple)):
                return [safe(v) for v in value]
            if isinstance(value, dict):
                return {str(k): safe(v) for k, v in value.items() if isinstance(k, (str, int))}
            if type(value).__name__ == 'Vector' and hasattr(value, 'toTuple'):
                return {'vector_xyz': safe(value.toTuple()), 'length': safe(float(value.Length))}
            return {'observed_python_type': type(value).__module__+'.'+type(value).__name__}
        
        
        def snapshot_locals(value):
            """Copy Python containers; hold native values without calling their APIs."""
            if isinstance(value, (list, tuple)):
                return [snapshot_locals(v) for v in value]
            if isinstance(value, dict):
                return {k: snapshot_locals(v) for k, v in value.items()}
            return value
        
        

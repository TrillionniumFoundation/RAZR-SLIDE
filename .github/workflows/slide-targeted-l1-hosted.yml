            if first['f_bavail_bytes'] < 200*2**20 or first['estimated_unreclaimable_bytes']+1536*2**20 > 6.8*2**30:
                receipt['resource_start_refused'] = True; save(); return 3
            child = channel = None
            started = time.monotonic(); last = started
            def observe(memory=None):
                nonlocal last
                now = worker.resource_snapshot(out); elapsed = time.monotonic()-started
                reason = ('hard 1800-second wall budget exceeded' if elapsed > 1800 else
                          'runtime disk reserve below 100 MiB' if now['f_bavail_bytes'] < 100*2**20 else
                          'shared estimated unreclaimable memory exceeded 6.8 GiB' if now['estimated_unreclaimable_bytes'] > 6.8*2**30 else
                          'owned worker RSS exceeded 1536 MiB' if memory is not None and max(memory.values()) > 1536*2**20 else None)
                if reason or elapsed < 10 or time.monotonic()-last >= 10:
                    receipt['resource_observations'].append({**now, 'elapsed_seconds': elapsed, 'owned_worker_memory': memory})
                    last = time.monotonic(); save()
                if reason:
                    receipt['capacity_or_wall_stop'] = reason; save(); raise RuntimeError(reason)
            try:
                channel = owned.OwnedChildChannel(Path(__file__).resolve())
                command = [str(args.root/'.venv/bin/python'), '-B', str(Path(__file__).resolve()), '--native',
                    '--root', str(args.root), '--original-report', str(args.original_report.resolve()),
                    '--targets', str(args.targets.resolve()), '--shard', args.shard, '--output', str(out)]
                receipt['command'] = command
                env = {**os.environ, 'PYTHONDONTWRITEBYTECODE': '1', 'OPENBLAS_NUM_THREADS': '1',
                       'OMP_NUM_THREADS': '1', 'MKL_NUM_THREADS': '1', 'NUMEXPR_NUM_THREADS': '1'}
                with (out/'native.log').open('xb') as log:
                    child = subprocess.Popen(command, cwd=args.root, env=channel.child_env(env),
                        stdout=log, stderr=subprocess.STDOUT, start_new_session=True, pass_fds=channel.pass_fds)
                    receipt.update(worker_started=True, worker_pid=child.pid); channel.after_spawn(); save()
                    receipt['owned_child_handshake'] = channel.accept(child, timeout_seconds=10, poll_callback=observe)
                    receipt['owned_child_identity_verified'] = True; save()
                    while child.poll() is None:
                        try:
                            memory = channel.sample(child)
                        except owned.OwnedChildExited:
                            if child.poll() is not None:
                                break
                            raise
                        observe(memory); time.sleep(1)
                    receipt['worker_exit_code'] = child.wait()
            except BaseException as exc:
                receipt['failure'] = exception_record(exc)
                if child is not None:
                    if child.poll() is None:
                        try: os.killpg(child.pid, signal.SIGTERM)
                        except ProcessLookupError: pass
                        try: child.wait(timeout=5)
                        except subprocess.TimeoutExpired:
                            try: os.killpg(child.pid, signal.SIGKILL)
                            except ProcessLookupError: pass
                            child.wait()
                    receipt['worker_exit_code'] = child.returncode
            finally:
                if channel is not None:
                    channel.close(); receipt['owned_channel_descriptors_closed'] = not channel.descriptors
            receipt['elapsed_seconds'] = time.monotonic()-started
            receipt['source_after'] = worker.source_identity()
            receipt['source_and_inputs_unchanged'] = (sources == receipt['source_after'] and sha(__file__) == external
                and sha(args.targets) == target_sha and sha(args.original_report) == ORIGINAL_REPORT_SHA)
            path = out/'report.json'
            if path.is_file():
                result = json.loads(path.read_text()); receipt['report_sha256'] = sha(path)
                receipt['worker_execution_completed'] = result.get('execution_completed')
                receipt['diagnostic_evidence_completed'] = result.get('diagnostic_evidence_completed')
            receipt['completed'] = bool(not receipt.get('failure') and not receipt.get('capacity_or_wall_stop')
                and receipt.get('worker_exit_code') == 0 and receipt.get('diagnostic_evidence_completed') is True
                and receipt['source_and_inputs_unchanged'] and receipt['owned_child_identity_verified']
                and receipt.get('owned_channel_descriptors_closed') is True)
            receipt['resource_observations'].append(worker.resource_snapshot(out)); save()
            print(json.dumps({k: receipt.get(k) for k in ('completed', 'worker_exit_code', 'diagnostic_evidence_completed', 'elapsed_seconds')}), flush=True)
            return 0 if receipt['completed'] else 2
        
        

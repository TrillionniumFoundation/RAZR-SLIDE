        assert r['expected_calls']==c['expected_calls']==len(r['case_results'])==n and r['target_case_ids']==[t['case_id'] for t in selected]
        assert r['native_identity_before']==r['native_identity_after'] and r['native_identity_before']['repository_head']==os.environ['C2']
        assert r['source_identity_before']==r['source_identity_after']==c['source_before']==c['source_after']
        assert {str(pathlib.Path(p).relative_to(root)):v for p,v in c['source_before'].items()}==source['actual_C2_r3_helper_sha256']
        assert r['base_complete_material_validated'] is True and len(r['complete_native_participant_names'])==154 and len(r['base_spring_identity_checks'])==4
        assert r['resource']['continuous_pair_calls']==n and r['resource']['wall_limit_seconds']==1800 and r['resource']['peak_RSS_limit_MiB']==1536 and r['resource']['shared_unreclaimable_limit_GiB']==6.8
        flags=('original_full_r3_execution_claimed','all_11781_pairs_reexecuted','whole_slide_domain_proved_clear','collision_proved_by_enclosure_overlap','independent_native_STEP_readback_executed','physical_qualification','candidate_go','fixture_fabrication_go','manufacturing_go')
        assert all(c[k] is False and r[k] is False for k in flags)
        assert r['original_full_factory_probe_sequence_repeated'] is False
        states=collections.Counter();changed=0;exports=0
        for row,target in zip(r['case_results'],selected):
         assert row['case_id']==target['case_id'] and row['native_call_completed'] is True and row['diagnostic_evidence_completed'] is True
         relative=pathlib.PurePosixPath(row['path']);assert not relative.is_absolute() and '..' not in relative.parts
         p=(run/relative).resolve();assert p.is_relative_to(run.resolve()) and p.is_file() and not p.is_symlink() and sha(p)==row['sha256']
         record=json.loads(p.read_text());assert record['target']==target and record['original_record_replaced'] is False and record['diagnostic_evidence_completed'] is True
         trace=record['trace'];assert trace['original_functions_replaced'] is False and trace['source_functions_mutated'] is False and trace['sys_settrace_observation_only'] is True and not trace['observer_failures']
         assert row['captured_material_count']==len(trace['captured_materials'])==len(record['material_exports']) and len(record['material_exports'])>=2
         for m in record['material_exports']:
          assert m['signature_unchanged_by_serialization'] is True and set(m['exports'])=={'brep','step'} and m['invalid_or_nonpositive_topology_is_preserved_as_diagnostic_evidence'] is True
          for data in m['exports'].values():
           assert 'export_failure' not in data and pathlib.PurePosixPath(data['path']).name==data['path']
           f=p.parent/data['path'];assert f.is_file() and not f.is_symlink() and f.stat().st_size==data['bytes']>0 and sha(f)==data['sha256'];exports+=1
         states[record['current_original_aggregate_disposition']]+=1
         changed+=bool(record['raw_classification_change'])
        (case/'L1-complete-diagnostic-observation.json').write_text(json.dumps({'functional_source_commit':os.environ['C2'],'shard':shard,'diagnostic_evidence_completed':True,'actual_completed_calls':n,'current_original_aggregate_disposition_counts':dict(states),'raw_classification_changes':changed,'native_BREP_STEP_files_verified':exports,'original_report_not_relabelled':True,'all_11781_reexecuted':False,'continuous_clearance_or_G2_or_physical_qualification':False,'new_driver_sha256':source['external_driver_sha256'],'native_report_sha256':sha(run/'report.json')},indent=2)+'\n')
        print(json.dumps({'shard':shard,'diagnostic_complete':True,'calls':n,'aggregate_dispositions':dict(states),'clearance_claimed':False}))
        PY
    - name: Preserve current hashes and failure evidence without rewriting raw reports
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        environment_exit=not_executed
        if test -x .venv/bin/python && test -f tools/check_environment.py; then
          environment_exit=0
          /usr/bin/python3 -B "$HOST_ROOT/service-launch.py" "$CASE_DIR/environment-after-check" \
            .venv/bin/python -B tools/check_environment.py --output "$CASE_DIR/environment-after.json" || environment_exit=$?
        fi
        echo "$environment_exit" > "$CASE_DIR/environment-after.exit-code.txt"
        python3 -B - <<'PY'
        import hashlib, json, os, pathlib, subprocess
        case = pathlib.Path(os.environ['CASE_DIR'])
        def git(*args):
            p = subprocess.run(['git', *args], text=True, capture_output=True)
            return {'exit_code': p.returncode, 'stdout': p.stdout, 'stderr': p.stderr}
        source = {'head': git('rev-parse', 'HEAD'), 'status': git('status', '--porcelain', '--untracked-files=all')}
        if (case/'source-identity.json').is_file():
            r = json.loads((case/'source-identity.json').read_text())
            source['original_five_sources_unchanged'] = all(
              (pathlib.Path(r['study_directory'])/name).is_file() and
              hashlib.sha256((pathlib.Path(r['study_directory'])/name).read_bytes()).hexdigest() == digest
              for name, digest in r['study_source_sha256'].items())
        (case/'source-after.json').write_text(json.dumps(source, indent=2)+'\n')
        environment_file = case/'environment-after.json'
        environment_code = (case/'environment-after.exit-code.txt').read_text().strip()
        environment_passed = environment_file.is_file() and environment_code == '0' and json.loads(environment_file.read_text()).get('passed') is True
        (case/'environment-after-state.json').write_text(json.dumps({'status': 'passed' if environment_passed else 'failed' if environment_file.is_file() else 'not_executed', 'wrapper_exit_code': environment_code, 'checker_report_exists': environment_file.is_file(), 'passed': environment_passed}, indent=2)+'\n')
        l1=case/'L1_SOURCE_IDENTITY.json'
        if l1.is_file():
            binding=json.loads(l1.read_text());host=pathlib.Path(os.environ['HOST_ROOT']);root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
            checked={'external_driver_unchanged':hashlib.sha256((host/'replay_slide_targets.py').read_bytes()).hexdigest()==binding['external_driver_sha256'],'C2_helpers_unchanged':all(hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest for rel,digest in binding['actual_C2_r3_helper_sha256'].items())}
            (case/'L1-source-after.json').write_text(json.dumps(checked,indent=2)+'\n')
        members = {str(p.relative_to(case)): {'bytes': p.stat().st_size,
          'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
          for p in sorted(case.rglob('*')) if p.is_file() and p != case/'host-artifact-manifest.json'}
        (case/'host-artifact-manifest.json').write_text(json.dumps({'members': members}, indent=2)+'\n')
        assert source['head']['exit_code'] == 0 and source['head']['stdout'].strip() == os.environ['C2']
        assert source['status']['exit_code'] == 0 and not source['status']['stdout'].strip()
        assert source.get('original_five_sources_unchanged') is True
        assert (case/'environment-after.exit-code.txt').read_text().strip() == '0'
        assert json.loads((case/'environment-after.json').read_text()).get('passed') is True
        PY
        python3 -B -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["CASE_DIR"])/"L1-source-after.json").read_text()); assert r["external_driver_unchanged"] and r["C2_helpers_unchanged"]'
    - name: Preserve complete original archive, diagnostics, signed material, traces and all failures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: c2-slide-L1-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/razr-c2-slide-l1-bec1c8d7/slide/${{ matrix.shard }}
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14

                            case['current_original_aggregate_disposition'] = case['current_original_aggregate']['disposition']
                        except Exception as exc:
                            case['current_original_aggregate_failure'] = exception_record(exc)
                            case['current_original_aggregate_disposition'] = 'unresolved_evaluation'
                        case['original_aggregate_classification_changed'] = case['current_original_aggregate_disposition'] != target['original_attempt_disposition']
                    case['material_exports'] = []
                    atomic_json(folder/'result.json', case)
                    for material in observer.materials:
                        case['material_exports'].append(export_material(material, folder, budget))
                        atomic_json(folder/'result.json', case)
                    case['diagnostic_evidence_completed'] = bool(case['native_call_completed'] and not observer.failures
                        and all(m['signature_unchanged_by_serialization'] and all('export_failure' not in e for e in m['exports'].values())
                                for m in case['material_exports']))
                    case['elapsed_seconds'] = time.monotonic()-case['started_monotonic']
                    atomic_json(folder/'result.json', case)
                    report['case_results'].append({'case_id': target['case_id'], 'a': target['a'], 'b': target['b'],
                        'path': str((folder/'result.json').relative_to(out)), 'sha256': sha(folder/'result.json'),
                        'native_call_completed': case['native_call_completed'], 'diagnostic_evidence_completed': case['diagnostic_evidence_completed'],
                        'raw_equal_to_original': case.get('raw_equal_to_original'),
                        'raw_classification_change': case.get('raw_classification_change'),
                        'actual_native_exception_count': len(observer.exceptions), 'captured_material_count': len(observer.materials)})
                    report['resource'] = budget.record(); atomic_json(out/'report.json', report)
                    print(json.dumps(report['case_results'][-1]), flush=True)
                    del observer, moving, fixed
                report['execution_completed'] = all(c['native_call_completed'] for c in report['case_results']) and len(report['case_results']) == len(selected)
                report['diagnostic_evidence_completed'] = report['execution_completed'] and all(c['diagnostic_evidence_completed'] for c in report['case_results'])
            except BaseException as exc:
                report['failure'] = exception_record(exc)
            finally:
                sys.settrace(None)
                try:
                    if before is not None:
                        after = nominal.execution_identity(C2); report['native_identity_after'] = after
                        require(before == after, 'native source or locked environment changed during replay')
                    report['source_identity_after'] = worker.source_identity()
                    require(report['source_identity_before'] == report['source_identity_after'], 'r3 helpers changed during replay')
                    require(sha(__file__) == report['external_driver_sha256'] and sha(args.targets) == report['target_manifest_sha256']
                            and sha(args.original_report) == ORIGINAL_REPORT_SHA, 'diagnostic inputs changed')
                    report['source_and_inputs_unchanged'] = True
                except BaseException as exc:
                    report['postflight_failure'] = exception_record(exc)
                    report['diagnostic_evidence_completed'] = False
                report['resource'] = budget.record()
                atomic_json(out/'report.json', report)
            return 0 if report['diagnostic_evidence_completed'] and report.get('source_and_inputs_unchanged') else 2
        
        
        def supervise(args, worker, owned):
            out = args.output.resolve()
            require(not out.exists() and not out.is_relative_to(args.root), 'new output outside checkout required')
            out.mkdir(parents=True)
            original, targets = read_inputs(args)
            selected = [c for c in targets['cases'] if c['shard'] == args.shard]
            sources = worker.source_identity(); external = sha(__file__); target_sha = sha(args.targets)
            first = worker.resource_snapshot(out)

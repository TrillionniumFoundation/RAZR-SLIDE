        \ if ':' in line)\n    ns = {k: os.readlink(base/'ns'/k) for k in NS_KEYS}\n    return {'epoch': time.time(), 'pid':\
        \ os.getpid() if pid == 'self' else int(pid), 'records': records, 'status': status, 'namespaces': ns}\ndef unescape(s):\
        \ return re.sub(r'\\\\([0-7]{3})', lambda m: chr(int(m.group(1), 8)), s)\ndef mounts(text):\n    result = []\n   \
        \ for line in text.splitlines():\n        a, b = line.split(' - ', 1); left, right = a.split(), b.split()\n      \
        \  result.append({'id': int(left[0]), 'root': unescape(left[3]), 'mountpoint': unescape(left[4]), 'options': left[5].split(','),\
        \ 'optional': left[6:], 'fstype': right[0], 'source': unescape(right[1]), 'super_options': right[2].split(',')})\n\
        \    return result\ndef group_path(text):\n    rows = [line.split(':', 2) for line in text.splitlines() if line.startswith('0::')]\n\
        \    require(len(rows) == 1, 'one real unified cgroup membership required')\n    path = P(rows[0][2]); require(path.is_absolute()\
        \ and '..' not in path.parts and str(path) != '/', 'non-root current service cgroup required')\n    return path\n\
        def measured(label, base):\n    r = {'directory': ident(base), 'epoch': time.time(), 'files': {k: capture(label+'-'+k,\
        \ P(base)/k) for k in ('memory.stat', 'memory.current', 'memory.max', 'cgroup.type')}}\n    save(label+'.json', r)\n\
        \    values = dict((k, int(v)) for k, v in (line.split() for line in require_text(r['files']['memory.stat']).splitlines()))\n\
        \    require(all(k in values for k in set(CONTROL_KEYS+V4_KEYS+FINITE_KEYS)), 'real memory.stat missing required counters')\n\
        \    require(all(v >= 0 for v in values.values()), 'negative memory.stat counter')\n    current = int(require_text(r['files']['memory.current']).strip());\
        \ require(current >= 0, 'negative current')\n    cap = require_text(r['files']['memory.max']).strip(); require(cap\
        \ == 'max' or (cap.isdecimal() and int(cap) >= 0), 'invalid maximum')\n    r.update(values=values, current=current,\
        \ maximum=cap)\n    save(label+'.json', r)\n    return r\ndef member_identity_matches(old, new):\n    require(same_inode(old['directory'],\

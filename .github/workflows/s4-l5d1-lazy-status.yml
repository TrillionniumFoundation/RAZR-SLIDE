        def children():\n    path=P('/proc/self/task')/str(os.getpid())/'children'\n    result=[]\n    for value in path.read_text().split():\n\
        \        try:\n            r=proc_identity(int(value),full=False); require(r['ppid']==os.getpid(), 'kernel child list\

name: L5d1 lazy raw Boolean status diagnosis
'on':
  push:
    branches:
    - diagnostic/s4-l5d1-lazy-status-20261027
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: l5d1-preserved-raw-boolean-${{ github.ref }}
  cancel-in-progress: false
env:
  S4: dd7def6e6a4de9f47dc91ca2ab336fb1a8828560
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  diagnostic:
    name: L5d1 preserved raw Boolean status and binding diagnosis
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CASE_KIND: l5
      CASE_KEY: original
    steps:
    - name: Start separate hosted deadline and scratch evidence directory
      shell: bash
      run: 'set -euo pipefail

        host_root="$RUNNER_TEMP/razr-s4-k1-l5-cylindrical-20261026"

        case_dir="$host_root/$CASE_KIND/$CASE_KEY"

        mkdir -p "$case_dir"

        echo "HOST_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

        echo "HOST_ROOT=$host_root" >> "$GITHUB_ENV"

        echo "CASE_DIR=$case_dir" >> "$GITHUB_ENV"

        '
    - name: Checkout immutable functional S4, not this diagnostic branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dd7def6e6a4de9f47dc91ca2ab336fb1a8828560
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: '/*

          !/archive/blobs/

          !/baselines/**

          /baselines/**/*.py

          /baselines/**/*.md

          /baselines/**/*.json

          '
    - name: Bind unchanged S4 and L5 sources plus exact named L5d1 diagnostic sources
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$S4\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\
        \npython3 -B - <<'PY'\nimport hashlib, json, os, pathlib, shutil, tarfile\nroot = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()\n\
        host = pathlib.Path(os.environ['HOST_ROOT']).resolve()\ncase = pathlib.Path(os.environ['CASE_DIR']).resolve()\nstudy\
        \ = host/'original-v4'\narchive_rel = 'engineering/gate-closure-20261023/geometry-followon-042b7689/key-v4-readback-algebra/results.tar.gz'\n\
        archive = root/archive_rel\narchive_sha = 'beef1cf45fb49417c6af092fec51fb266fd6e89f238410c8cf137af4c20ce442'\nexpected\
        \ = {\n  'integration/probe_key_endpoint_extension.py': 'a2f15dd4c9f41a9235e4c7625da52c9bf81add0260556d841e65c6261123408e',\n\
        \  'tools/key_endpoint_resume.py': 'f9fa0e36cfdae30a24eab771c015b260d004573d60a23351bf266d1cb28cfb49',\n  'run_key_endpoint_trials.py':\
        \ 'ecd57df70e7df83e42083b6019e3b84da261c486c8c9681909a4b192b4505dad',\n  'tests/test_key_endpoint_extension.py': '3fe949b3a0036875946263bc5d6f97fce4d8555cc2c0b7d0686f263bbe99e60b',\n\
        \  'tests/test_key_endpoint_resume.py': '6038b8ea4659bb3095f766d75ef54b1d607e1f3096ece816cb887fbaec3d0188',\n}\nassert\
        \ not host.is_relative_to(root) and not study.exists()\nassert not archive.is_symlink()\nassert hashlib.sha256(archive.read_bytes()).hexdigest()\
        \ == archive_sha\nprefix = 'gates_audit/dev/key-endpoint-v4/'\nwith tarfile.open(archive, 'r:gz') as tar:\n    for\
        \ name, digest in expected.items():\n        matches = [m for m in tar.getmembers() if m.name == prefix+name]\n  \
        \      assert len(matches) == 1 and matches[0].isfile() and 0 < matches[0].size < 1024**2\n        data = tar.extractfile(matches[0]).read()\n\
        \        assert hashlib.sha256(data).hexdigest() == digest\n        target = study/name\n        target.parent.mkdir(parents=True,\
        \ exist_ok=True)\n        with target.open('xb') as stream: stream.write(data)\nreceipt = {'functional_source_commit':\
        \ os.environ['S4'],\n  'historical_archive': archive_rel, 'archive_sha256': archive_sha,\n  'archive_member_prefix':\
        \ prefix, 'study_source_sha256': expected,\n  'study_directory': str(study), 'source_bytes_modified': False}\n(case/'source-identity.json').write_text(json.dumps(receipt,\
        \ indent=2)+'\\n')\nshutil.copytree(study, case/'source'/'original-v4')\ncontract = {'functional_source_commit': os.environ['S4'],\
        \ 'repository_root': str(root),\n  'runner_temp': str(pathlib.Path(os.environ['RUNNER_TEMP']).resolve()),\n  'host_root':\
        \ str(host), 'study_root': str(study),\n  'baseline_paths': {p: str(host/'controls'/p/(p+'-report.json')) for p in\
        \ ('STOW', 'OPEN')}}\n(case/'path-contract.json').write_text(json.dumps(contract, indent=2)+'\\n')\n(case/'hosted-context.json').write_text(json.dumps({\n\
        \  'workflow_revision': os.environ['GITHUB_SHA'], 'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF'),\n  'functional_source_commit':\
        \ os.environ['S4'], 'run_id': os.environ['GITHUB_RUN_ID'],\n  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'job':\
        \ os.environ['GITHUB_JOB'],\n  'case_kind': os.environ['CASE_KIND'], 'case_key': os.environ['CASE_KEY'],\n  'platform_runner_label':\
        \ 'ubuntu-22.04', 'platform_maximum_job_seconds': 2400,\n  'original_F1_trial_budget_not_applicable': True,\n  'original_F1_finite_worker_budget_not_used':\
        \ 1200,\n  'L5_original_SLIDE_worker_budget_seconds': 1800,\n  'original_90_second_positive_only_KEY_reader_used':\
        \ False,\n  'canonical_unit_suite_timeouts_unchanged': True,\n  'external_command_deadline_seconds_after_first_step':\
        \ 2220,\n  'external_SIGINT_cleanup_grace_seconds': 20,\n  'hosted_execution_is_new_evidence': True, 'physical_qualification':\
        \ False,\n  'complete_product_motion_proved': False, 'G2_pass': False}, indent=2)+'\\n')\nPY\ncat > \"$HOST_ROOT/host-cap.py\"\
        \ <<'PY'\n\"\"\"Outer hosted cap only; never change a S4/original worker or its gates.\"\"\"\nimport hashlib, json,\
        \ os, pathlib, signal, subprocess, sys, time\ntarget = pathlib.Path(sys.argv[1])\ncommand = sys.argv[2:]\ntarget.parent.mkdir(parents=True,\
        \ exist_ok=True)\ndeadline = float(os.environ['HOST_JOB_START']) + 2220\ndef resource():\n    stat = os.statvfs(target.parent)\n\
        \    files = {}\n    for name in ('memory.current', 'memory.max', 'memory.stat'):\n        p = pathlib.Path('/sys/fs/cgroup')/name\n\
        \        files[name] = p.read_text()\n    return {'epoch': time.time(), 'writeable_disk_bytes': stat.f_bavail*stat.f_frsize,\n\
        \            'root_reserved_free_bytes_diagnostic_only': stat.f_bfree*stat.f_frsize,\n            'cgroup': files}\n\
        receipt = {'argv': command, 'cwd': os.getcwd(), 'started_epoch': time.time(),\n    'external_deadline_epoch': deadline,\
        \ 'platform_maximum_job_seconds': 2400,\n    'original_F1_finite_worker_budget_not_used': 1200,\n    'L5_original_SLIDE_worker_budget_seconds':\
        \ 1800,\n  'original_90_second_positive_only_KEY_reader_used': False,\n    'canonical_unit_suite_timeouts_unchanged':\
        \ True,\n    'outer_hosted_cap_reached': False, 'process_started': False,\n    'resource_before': None, 'source_sha256':\
        \ hashlib.sha256(pathlib.Path(__file__).read_bytes()).hexdigest()}\nchild = None\ncode = 2\ndef external_term(signum,\
        \ frame):\n    raise KeyboardInterrupt('external SIGTERM mapped to original cleanup')\nsignal.signal(signal.SIGTERM,\
        \ external_term)\ntry:\n    receipt['resource_before'] = resource()\n    if time.time() >= deadline-30:\n        raise\
        \ RuntimeError('insufficient hosted time remains; no command started')\n    with target.with_suffix('.log').open('xb')\
        \ as log, target.with_suffix('.resources.jsonl').open('x') as samples:\n        child = subprocess.Popen(command,\
        \ stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\n        receipt.update(process_started=True, owned_child_pid=child.pid)\n\
        \        while child.poll() is None:\n            samples.write(json.dumps(resource())+'\\n'); samples.flush()\n \
        \           if time.time() >= deadline:\n                receipt['outer_hosted_cap_reached'] = True\n            \
        \    child.send_signal(signal.SIGINT)\n                try: child.wait(timeout=20)\n                except subprocess.TimeoutExpired:\n\
        \                    receipt['SIGINT_cleanup_timed_out'] = True\n                    os.killpg(child.pid, signal.SIGKILL)\n\
        \                    child.wait(timeout=5)\n                break\n            try: child.wait(timeout=min(5, max(.05,\
        \ deadline-time.time())))\n            except subprocess.TimeoutExpired: pass\n        receipt['child_exit_code']\
        \ = child.returncode\n        code = 124 if receipt['outer_hosted_cap_reached'] else child.returncode\nexcept BaseException\
        \ as exc:\n    receipt['failure'] = type(exc).__name__+': '+str(exc)\n    if child is not None and child.poll() is\
        \ None:\n        child.send_signal(signal.SIGINT)\n        try: child.wait(timeout=20)\n        except subprocess.TimeoutExpired:\n\
        \            os.killpg(child.pid, signal.SIGKILL); child.wait(timeout=5)\nfinally:\n    try: receipt['resource_after']\
        \ = resource()\n    except BaseException as exc:\n        receipt['resource_after'] = None\n        receipt['resource_after_error']\
        \ = type(exc).__name__+': '+str(exc)\n        code = 2\n    receipt.update(exit_code=code, finished_epoch=time.time())\n\
        \    target.with_suffix('.json').write_text(json.dumps(receipt, indent=2)+'\\n')\nraise SystemExit(code)\nPY\ncp \"\
        $HOST_ROOT/host-cap.py\" \"$CASE_DIR/source/host-cap.py\"\ncat > \"$HOST_ROOT/service-launch.py\" <<'PY'\n\"\"\"D6\
        \ external harness: real readonly service view and owned subreaper lifecycle.\nNo S4/original source edits; all task-owned\
        \ evidence stays outside the checkout.\n\"\"\"\nimport ctypes, errno, hashlib, importlib.util, json, os, pathlib,\
        \ re, select, secrets, shutil, signal, subprocess, sys, time\nP = pathlib.Path\nSCRIPT = P(__file__).resolve()\nINTERNAL\
        \ = len(sys.argv) > 1 and sys.argv[1] in ('--private-root', '--inside', '--signal-check')\nif INTERNAL:\n    MODE\
        \ = sys.argv[1][2:]\n    OUT = P(sys.argv[2]).resolve()\n    REPO = P(sys.argv[3]).resolve() if len(sys.argv) > 3\
        \ else P(os.environ['GITHUB_WORKSPACE']).resolve()\n    TARGET = None; COMMAND = []\nelse:\n    MODE = 'outside';\
        \ TARGET = P(sys.argv[1]).resolve(); COMMAND = sys.argv[2:]\n    OUT = TARGET.with_name(TARGET.name+'.namespace');\
        \ REPO = P(os.environ['GITHUB_WORKSPACE']).resolve()\nif MODE in ('outside', 'signal-check'):\n    OUT.mkdir(parents=True,\
        \ exist_ok=False)\nRAW = OUT/'raw'; RAW.mkdir(exist_ok=True)\nS4 = 'dd7def6e6a4de9f47dc91ca2ab336fb1a8828560'\nSUP_REL\
        \ = 'engineering/engineering-integration-20261025/numerics/run_bounded.py'\nSUP_SHA = '901654cdb718a988471a700b01bfbb2e8979a98248c9211fa69d42b25279e56e'\n\
        ARCH_REL = 'engineering/gate-closure-20261023/geometry-followon-042b7689/key-v4-readback-algebra/results.tar.gz'\n\
        ARCH_SHA = 'beef1cf45fb49417c6af092fec51fb266fd6e89f238410c8cf137af4c20ce442'\nV4_MEMBER = 'gates_audit/dev/key-endpoint-v4/run_key_endpoint_trials.py'\n\
        V4_SHA = 'ecd57df70e7df83e42083b6019e3b84da261c486c8c9681909a4b192b4505dad'\nCONTROL_KEYS = ('anon', 'shmem', 'kernel_stack',\
        \ 'pagetables', 'sock', 'slab_unreclaimable')\nV4_KEYS = ('inactive_file', 'file_dirty', 'file_writeback', 'file',\
        \ 'shmem')\nFINITE_KEYS = ('anon', 'shmem', 'kernel', 'slab_reclaimable', 'unevictable')\nNS_KEYS = ('mnt', 'pid',\
        \ 'pid_for_children', 'user', 'cgroup')\ndef require(value, message):\n    if not value: raise RuntimeError(message)\n\
        def sha(path): return hashlib.sha256(P(path).read_bytes()).hexdigest()\ndef save(name, value):\n    final=OUT/name;\
        \ temporary=final.with_name(final.name+'.tmp-'+str(os.getpid()))\n    temporary.write_text(json.dumps(value,indent=2,sort_keys=True)+'\\\
        n');os.replace(temporary,final)\ndef ident(path):\n    path = P(path); s = path.stat()\n    return {'path': str(path),\
        \ 'device': s.st_dev, 'inode': s.st_ino, 'mode': s.st_mode, 'symlink': path.is_symlink()}\ndef same_inode(a, b): return\
        \ (a['device'], a['inode']) == (b['device'], b['inode'])\ndef capture(label, path):\n    r = {'path': str(path), 'epoch':\
        \ time.time(), 'readable': False}\n    try:\n        r['identity'] = ident(path)\n        data = P(path).read_bytes();\
        \ r.update(readable=True, bytes=len(data), sha256=hashlib.sha256(data).hexdigest())\n        (RAW/(label+'.txt')).write_bytes(data)\n\
        \        r['text'] = data.decode('utf-8', errors='strict')\n    except (OSError, UnicodeError) as e: r['error'] =\
        \ type(e).__name__+': '+str(e)\n    return r\ndef require_text(r):\n    require(r['readable'], 'required real interface\
        \ unavailable: '+r['path']+' '+r.get('error', ''))\n    require(not r['identity']['symlink'], 'interface symlink rejected')\n\
        \    return r['text']\ndef proc(label, pid='self'):\n    base = P('/proc')/str(pid)\n    records = {k: capture(label+'-'+k,\

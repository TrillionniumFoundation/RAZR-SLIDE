# D2 capability probe only. Replaces the diagnostic workflow, never C2 sources.
# No checkout, dependency installation, CAD import, geometry, or qualification.
name: C2 native runner capability probe D2

'on':
  push:
    branches: ['diagnostic/c2-key-hosted-20261025']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2-key-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capability:
    name: C2-resource-interface-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-slim, ubuntu-22.04]
    env:
      PROBED_RUNNER_LABEL: ${{ matrix.runner }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record real proc and cgroup interfaces without installing or running CAD
        shell: bash
        run: |
          set -euo pipefail
          export PROBE_DIR="$RUNNER_TEMP/razr-c2-native-capability"
          mkdir -p "$PROBE_DIR"
          cat > "$PROBE_DIR/probe.py" <<'PY'
          import hashlib, json, math, os, pathlib, platform, sys, time
          out = pathlib.Path(os.environ['PROBE_DIR'])
          raw = out/'raw'
          raw.mkdir(exist_ok=True)
          records = {}
          texts = {}
          targets = {
            'proc-self-mountinfo.txt': '/proc/self/mountinfo',
            'proc-self-cgroup.txt': '/proc/self/cgroup',
            'proc-self-status.txt': '/proc/self/status',
            'proc-self-stat.txt': '/proc/self/stat',
            'proc-meminfo.txt': '/proc/meminfo',
            'cgroup-memory.stat.txt': '/sys/fs/cgroup/memory.stat',
            'cgroup-memory.current.txt': '/sys/fs/cgroup/memory.current',
            'cgroup-memory.max.txt': '/sys/fs/cgroup/memory.max',
            'cgroup-controllers.txt': '/sys/fs/cgroup/cgroup.controllers',
            'cgroup-type.txt': '/sys/fs/cgroup/cgroup.type',
          }
          for name, source in targets.items():
              p = pathlib.Path(source)
              r = {'source_path': source, 'readable': False, 'is_symlink': p.is_symlink()}
              try:
                  data = p.read_bytes()
                  text = data.decode('utf-8', errors='strict')
                  (raw/name).write_bytes(data)
                  texts[name] = text
                  r.update(readable=True, bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
              except (OSError, UnicodeError) as exc:
                  r['error'] = type(exc).__name__+': '+str(exc)
              records[name] = r
          links = {}
          for source in ('/proc/self', '/proc/self/ns/pid', '/proc/self/ns/pid_for_children'):
              try: links[source] = {'readable': True, 'target': os.readlink(source)}
              except OSError as exc: links[source] = {'readable': False, 'error': type(exc).__name__+': '+str(exc)}
          entries = []
          try:
              for p in sorted(pathlib.Path('/sys/fs/cgroup').iterdir())[:256]:
                  entries.append({'name': p.name, 'is_dir': p.is_dir(), 'is_file': p.is_file(), 'is_symlink': p.is_symlink()})
              directory = {'readable': True, 'entries': entries, 'maximum_entries_recorded': 256}
          except OSError as exc:
              directory = {'readable': False, 'error': type(exc).__name__+': '+str(exc)}
          (out/'cgroup-directory.json').write_text(json.dumps(directory, indent=2)+'\n')
          stat = os.statvfs(out)
          disk = stat.f_bavail*stat.f_frsize
          parse_errors = {}
          memory_stat = None
          current = None
          maximum = None
          host_available = None
          try:
              memory_stat = dict((k, int(v)) for k, v in (line.split() for line in texts['cgroup-memory.stat.txt'].splitlines()))
              if not memory_stat or any(v < 0 for v in memory_stat.values()): raise ValueError('invalid memory.stat values')
          except (KeyError, ValueError) as exc:
              memory_stat = None
              parse_errors['memory.stat'] = type(exc).__name__+': '+str(exc)
          try:
              current = int(texts['cgroup-memory.current.txt'].strip())
              if current < 0: raise ValueError('negative memory.current')
          except (KeyError, ValueError) as exc:
              current = None
              parse_errors['memory.current'] = type(exc).__name__+': '+str(exc)
          try:
              m = texts.get('cgroup-memory.max.txt')
              if m is None:
                  if not records['cgroup-memory.max.txt'].get('error', '').startswith('FileNotFoundError:'):
                      raise ValueError('memory.max exists but is not readable')
                  maximum = 'max'
              else:
                  maximum = 'max' if m.strip() == 'max' else int(m.strip())
                  if isinstance(maximum, int) and maximum < 0: raise ValueError('negative memory.max')
          except ValueError as exc:
              maximum = None
              parse_errors['memory.max'] = type(exc).__name__+': '+str(exc)
          try:
              info = dict(line.split(':', 1) for line in texts['proc-meminfo.txt'].splitlines())
              parts = info['MemAvailable'].split()
              if len(parts) != 2 or parts[1] != 'kB': raise ValueError('unexpected MemAvailable units')
              host_available = int(parts[0])*1024
              if host_available < 0: raise ValueError('negative MemAvailable')
          except (KeyError, ValueError) as exc:
              host_available = None
              parse_errors['MemAvailable'] = type(exc).__name__+': '+str(exc)
          source_keys = ('anon', 'shmem', 'kernel_stack', 'pagetables', 'sock', 'slab_unreclaimable')
          # Missing/unreadable interfaces are UNKNOWN, never synthetic zero.
          required_ok = memory_stat is not None and current is not None
          missing_counter_keys = [] if memory_stat is None else [k for k in source_keys if k not in memory_stat]
          counters_ok = required_ok and not missing_counter_keys
          original_control_nonreclaimable = sum(memory_stat[k] for k in source_keys) if counters_ok else None
          v4_keys = ('inactive_file', 'file_dirty', 'file_writeback', 'file', 'shmem')
          v4_missing = [k for k in v4_keys if memory_stat is None or k not in memory_stat]
          finite_keys = ('anon', 'shmem', 'kernel', 'slab_reclaimable', 'unevictable')
          finite_missing = [k for k in finite_keys if memory_stat is None or k not in memory_stat]
          original_v4 = {'missing_required_counter_keys': v4_missing, 'eligibility': False, 'effective_memory_headroom_bytes': None, 'shared_unreclaimable_memory_bytes': None}
          if required_ok and not v4_missing and host_available is not None and maximum is not None and not parse_errors:
              inactive = max(0, memory_stat.get('inactive_file', 0)-memory_stat.get('file_dirty', 0)-memory_stat.get('file_writeback', 0))
              hard = maximum-current if isinstance(maximum, int) else host_available
              effective = min(host_available, hard+inactive)
              clean = max(0, memory_stat.get('file', 0)-memory_stat.get('shmem', 0)-memory_stat.get('file_dirty', 0)-memory_stat.get('file_writeback', 0))
              original_v4.update(effective_memory_headroom_bytes=effective,
                shared_unreclaimable_memory_bytes=max(0, current-clean),
                eligibility=bool(disk >= 256*1024**2 and effective >= 2*1024**3),
                original_startup_disk_bytes=256*1024**2, original_startup_headroom_bytes=2*1024**3)
          finite_shared = None if memory_stat is None or finite_missing else (memory_stat.get('anon', 0)+memory_stat.get('shmem', 0)
            + max(0, memory_stat.get('kernel', 0)-memory_stat.get('slab_reclaimable', 0))+memory_stat.get('unevictable', 0))
          proc_status = {}
          for line in texts.get('proc-self-status.txt', '').splitlines():
              if ':' in line:
                  k, v = line.split(':', 1); proc_status[k] = v.strip()
          positive_rss_fields = False
          try:
              rss = proc_status['VmRSS'].split(); hwm = proc_status['VmHWM'].split()
              positive_rss_fields = rss[1] == hwm[1] == 'kB' and 0 < int(rss[0]) <= int(hwm[0])
          except (KeyError, ValueError, IndexError): pass
          self_proc_ok = bool(links.get('/proc/self', {}).get('target', '').isdigit()
              and all(links.get(p, {}).get('readable') for p in ('/proc/self/ns/pid', '/proc/self/ns/pid_for_children'))
              and all(proc_status.get(k) for k in ('Pid', 'PPid', 'NSpid')) and positive_rss_fields
              and records['proc-self-stat.txt']['readable'])
          cgroup_v2_mount = False
          for line in texts.get('proc-self-mountinfo.txt', '').splitlines():
              parts = line.split(' - ', 1)
              if len(parts) == 2 and len(parts[0].split()) >= 5 and parts[1].split():
                  cgroup_v2_mount |= parts[0].split()[4] == '/sys/fs/cgroup' and parts[1].split()[0] == 'cgroup2'
          snapshot_eligible = bool(counters_ok and cgroup_v2_mount and disk >= 500*1024**2
              and original_control_nonreclaimable <= 6.8*1024**3)
          report = {
            'schema': 'razr-C2-hosted-resource-interface-probe-v1', 'observed_epoch': time.time(),
            'workflow_revision': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'runner_label': os.environ['PROBED_RUNNER_LABEL'],
            'platform': platform.platform(), 'python': sys.version, 'uid': os.geteuid(),
            'working_directory': str(pathlib.Path.cwd().resolve()), 'task_directory': str(out.resolve()),
            'functional_candidate_source': 'bec1c8d79a37b4ba387d606cd7ea1c5867f3f9eb',
            'source_contract': {
              'run_bounded_path': 'engineering/engineering-integration-20261025/numerics/run_bounded.py',
              'run_bounded_sha256': '901654cdb718a988471a700b01bfbb2e8979a98248c9211fa69d42b25279e56e',
              'sources_executed_by_this_probe': False,
              'probe_scope': 'real interface availability and a current resource snapshot only'},
            'raw_interfaces': records, 'proc_links': links, 'parse_errors': parse_errors,
            'memory_stat_counters': memory_stat, 'memory_current_bytes': current,
            'memory_max_bytes_or_max': maximum,
            'memory_max_absent_original_v4_uses_host_available': records['cgroup-memory.max.txt'].get('error', '').startswith('FileNotFoundError:'),
            'host_MemAvailable_bytes': host_available, 'ordinary_writeable_disk_bytes': disk,
            'root_reserved_free_bytes_diagnostic_only': stat.f_bfree*stat.f_frsize,
            'run_bounded_required_interfaces_readable': required_ok,
            'real_cgroup_v2_mount_at_required_path_observed': cgroup_v2_mount,
            'required_control_counter_values': {k: None if memory_stat is None else memory_stat.get(k) for k in source_keys},
            'missing_original_control_counter_keys': missing_counter_keys,
            'original_control_nonreclaimable_budget_bytes': original_control_nonreclaimable,
            'run_bounded_snapshot_eligible': snapshot_eligible,
            'original_control_limits': {'task_filesystem_reserve_bytes': 500*1024**2, 'shared_nonreclaimable_bytes': 6.8*1024**3},
            'original_v4_startup_snapshot': original_v4,
            'finite_missing_required_counter_keys': finite_missing,
            'finite_shared_unreclaimable_bytes': finite_shared,
            'finite_startup_resource_snapshot_eligible': bool(finite_shared is not None
              and disk >= 256*1024**2 and finite_shared+2048*1024**2 <= 6.8*1024**3),
            'self_proc_namespace_and_RSS_fields_readable': self_proc_ok,
            'owned_child_nonce_FD_protocol_exercised': False,
            'platform_advertised_RAM_used_as_measurement': False,
            'guard_values_fabricated_or_original_sources_modified': False,
            'dependency_installation_executed': False, 'CAD_import_or_geometry_executed': False,
            'native_qualification_granted': False, 'G2_pass': False, 'physical_qualification': False,
            'probe_source_sha256': hashlib.sha256(pathlib.Path(__file__).read_bytes()).hexdigest(),
            'future_execution_requirement': 'Repeat original source/runtime/resource preflights in every actual job; this snapshot cannot guarantee future capacity or CAD runtime availability.'}
          (out/'CAPABILITY.json').write_text(json.dumps(report, indent=2, allow_nan=False)+'\n')
          manifest = {str(p.relative_to(out)): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
            for p in sorted(out.rglob('*')) if p.is_file() and p.name != 'MEMBER_SHA256.json'}
          (out/'MEMBER_SHA256.json').write_text(json.dumps({'members': manifest}, indent=2)+'\n')
          print(json.dumps({k: report[k] for k in ('runner_label', 'run_bounded_required_interfaces_readable',
            'run_bounded_snapshot_eligible', 'original_v4_startup_snapshot',
            'finite_startup_resource_snapshot_eligible', 'self_proc_namespace_and_RSS_fields_readable',
            'CAD_import_or_geometry_executed')}, indent=2))
          PY
          python3 -B "$PROBE_DIR/probe.py"
      - name: Preserve original capability records on either outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c2-key-capability-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-c2-native-capability
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed if the original control resource interface cannot run here
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'razr-c2-native-capability/CAPABILITY.json'
          if not p.is_file(): raise SystemExit('missing original capability record')
          r = json.loads(p.read_text())
          if r.get('run_bounded_snapshot_eligible') is not True:
              raise SystemExit('original C2 run_bounded interfaces/counters/current capacity unavailable; NO CAD executed')
          print('Resource interface snapshot eligible; no CAD, owned-child handshake, or product qualification claimed.')
          PY

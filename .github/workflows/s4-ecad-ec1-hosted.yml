    - name: Ensure platform graphical shared-library prerequisites
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libglu1-mesa libgomp1 libfontconfig1
        libegl1 libopengl0

        '
    - name: Run original S4 verifier with pinned KiCad 9 bytes
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$RUNNER_TEMP/razr-ec1-source/run_ec1.py" "$RUNNER_TEMP/razr-ec1-source/EC1_PINNED_PACKAGES.json"

        '
    - name: Export scientific originals and labelled engineering projections
      if: ${{ always() }}
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$RUNNER_TEMP/razr-ec1-source/export_ec1.py"

        '
    - name: Preserve bounded ECAD engineering evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: s4-ec1-engineering
        path: ${{ runner.temp }}/razr-ec1-engineering
        include-hidden-files: false
        if-no-files-found: error
        retention-days: 90

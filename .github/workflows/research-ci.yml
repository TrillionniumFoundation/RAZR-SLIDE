name: Research validation

on:
  push:
    branches: [main, 'work/**', 'fix/**']
  pull_request:
    branches: [main, 'work/**', 'fix/**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ubuntu-slim has a provider-enforced 15 minute job limit. Every suite is
  # isolated; the aggregate below requires all manifest suites at one exact
  # source, lock, run and attempt. Heavy native gates remain independent.
  unit-plan:
    name: plan-current-unit-suites
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: false
      - id: matrix
        name: Select every suite from the checked manifest
        run: |
          suite_matrix=$(uv run --no-project --python 3.12 python -B tools/aggregate_unit_shards.py --print-matrix)
          echo "matrix=$suite_matrix" >> "$GITHUB_OUTPUT"

  unit-shard:
    name: unit-${{ matrix.id }}
    needs: unit-plan
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/blobs/
            !/baselines/**
            /baselines/**/*.py
            /baselines/**/*.md
            /baselines/**/*.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: false
      - name: Install exact locked research dependencies
        run: uv sync --locked --no-cache
      - name: Execute this suite with interpreter, package and source verification
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SUITE_ID: ${{ matrix.id }}
        run: >-
          uv run --locked python -B tools/verify.py
          --expected-head "$EXPECTED_HEAD"
          --suite "$SUITE_ID"
          --output "$RUNNER_TEMP/razr-unit"
      - name: Preserve this suite including failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-unit-shard-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-unit
          if-no-files-found: warn
          retention-days: 14

  unit:
    name: full-unit-suites
    if: always()
    needs: [unit-plan, unit-shard]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/blobs/
            !/baselines/**
            /baselines/**/*.py
            /baselines/**/*.md
            /baselines/**/*.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: research-unit-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-unit-shards
          merge-multiple: false
      - name: Verify exact complete coverage and raw result identities
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --no-project --python 3.12 python -B tools/aggregate_unit_shards.py
          --artifacts "$RUNNER_TEMP/razr-unit-shards"
          --expected-head "$EXPECTED_HEAD"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/razr-unit-aggregate.json"
      - name: Require every shard job to finish successfully
        env:
          PLAN_RESULT: ${{ needs.unit-plan.result }}
          SHARD_RESULT: ${{ needs.unit-shard.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SHARD_RESULT" = success
      - name: Preserve complete unit coverage receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-unit-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-unit-aggregate.json
          if-no-files-found: warn
          retention-days: 14

  native:
    name: native-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: lateral-guide
            commands: |
              uv run --locked python -B integration/endpoint_joint_pawl.py --output "$RUNNER_TEMP/razr-guide-endpoint"
              uv run --locked python -B integration/catalogue_roof_joint.py --baseline "$RUNNER_TEMP/razr-guide-endpoint/manifest.json" --output "$RUNNER_TEMP/razr-guide-catalogue"
              uv run --locked python -B integration/root_clearance.py --baseline "$RUNNER_TEMP/razr-guide-catalogue/manifest.json" --output "$RUNNER_TEMP/razr-guide-root"
              uv run --locked python -B integration/pawl_lateral_guide.py --baseline "$RUNNER_TEMP/razr-guide-root/manifest.json" --output "$RUNNER_TEMP/razr-lateral-guide"
              uv run --locked python -B integration/verify_pawl_lateral_guide.py --baseline "$RUNNER_TEMP/razr-guide-root/manifest.json" --manifest "$RUNNER_TEMP/razr-lateral-guide/manifest.json" --output "$RUNNER_TEMP/razr-lateral-guide/verification.json" --full
              uv run --locked python -B integration/pawl_box_guide.py --baseline "$RUNNER_TEMP/razr-lateral-guide/manifest.json" --output "$RUNNER_TEMP/razr-body-guide"
              uv run --locked python -B integration/verify_pawl_box_guide.py --baseline "$RUNNER_TEMP/razr-lateral-guide/manifest.json" --manifest "$RUNNER_TEMP/razr-body-guide/manifest.json" --output "$RUNNER_TEMP/razr-body-guide/verification.json" --full
              uv run --locked python -B integration/cover_backing.py --baseline "$RUNNER_TEMP/razr-body-guide/manifest.json" --output "$RUNNER_TEMP/razr-cover-backing"
              uv run --locked python -B integration/verify_cover_backing.py --baseline "$RUNNER_TEMP/razr-body-guide/manifest.json" --manifest "$RUNNER_TEMP/razr-cover-backing/manifest.json" --output "$RUNNER_TEMP/razr-cover-backing/verification.json" --full
              uv run --locked python -B integration/panel_shear_key.py --baseline "$RUNNER_TEMP/razr-cover-backing/manifest.json" --output "$RUNNER_TEMP/razr-panel-shear"
              uv run --locked python -B integration/verify_panel_shear_key.py --baseline "$RUNNER_TEMP/razr-cover-backing/manifest.json" --manifest "$RUNNER_TEMP/razr-panel-shear/manifest.json" --output "$RUNNER_TEMP/razr-panel-shear/verification.json" --full
              uv run --locked python -B integration/frame_nut_anchor.py --baseline "$RUNNER_TEMP/razr-panel-shear/manifest.json" --output "$RUNNER_TEMP/razr-frame-nut"
              uv run --locked python -B integration/verify_frame_nut_anchor.py --baseline "$RUNNER_TEMP/razr-panel-shear/manifest.json" --manifest "$RUNNER_TEMP/razr-frame-nut/manifest.json" --output "$RUNNER_TEMP/razr-frame-nut/verification.json" --full
              uv run --locked python -B integration/panel_bearing_web.py --baseline "$RUNNER_TEMP/razr-frame-nut/manifest.json" --output "$RUNNER_TEMP/razr-bearing-web"
              uv run --locked python -B integration/verify_panel_bearing_web.py --baseline "$RUNNER_TEMP/razr-frame-nut/manifest.json" --manifest "$RUNNER_TEMP/razr-bearing-web/manifest.json" --output "$RUNNER_TEMP/razr-bearing-web/verification.json" --full
          - id: phone-layout
            commands: |
              uv run --locked python -B integration/phone_layout.py --output "$RUNNER_TEMP/razr-phone-layout"
              uv run --locked python -B integration/verify_phone_layout.py --report "$RUNNER_TEMP/razr-phone-layout/report.json" --output "$RUNNER_TEMP/razr-phone-layout/readback.json"
          - id: thin
            commands: |
              uv run --locked python -B integration/thin_mechanism.py --output "$RUNNER_TEMP/razr-thin"
              uv run --locked python -B integration/verify_thin_mechanism.py --manifest "$RUNNER_TEMP/razr-thin/manifest.json" --output "$RUNNER_TEMP/razr-thin/verification.json"
          - id: mounted
            commands: |
              uv run --locked python -B integration/mounted_mechanism.py --output "$RUNNER_TEMP/razr-mounted"
              uv run --locked python -B integration/verify_mounted_mechanism.py --manifest "$RUNNER_TEMP/razr-mounted/manifest.json" --output "$RUNNER_TEMP/razr-mounted/verification.json"
          - id: coupling
            commands: |
              uv run --locked python -B integration/cam_coupling.py --output "$RUNNER_TEMP/razr-coupling"
              uv run --locked python -B integration/verify_cam_coupling.py --manifest "$RUNNER_TEMP/razr-coupling/manifest.json" --output "$RUNNER_TEMP/razr-coupling/verification.json"
          - id: pawl
            commands: |
              uv run --locked python -B integration/pawl_actuator.py --output "$RUNNER_TEMP/razr-pawl"
              uv run --locked python -B integration/verify_pawl_actuator.py --manifest "$RUNNER_TEMP/razr-pawl/manifest.json" --output "$RUNNER_TEMP/razr-pawl/verification.json"
          - id: serviceable
            commands: |
              uv run --locked python -B integration/serviceable_pawl.py --output "$RUNNER_TEMP/razr-serviceable"
              uv run --locked python -B integration/verify_serviceable_pawl.py --manifest "$RUNNER_TEMP/razr-serviceable/manifest.json" --output "$RUNNER_TEMP/razr-serviceable/verification.json"
          - id: endpoint-joint
            commands: |
              uv run --locked python -B integration/endpoint_joint_pawl.py --output "$RUNNER_TEMP/razr-endpoint-joint"
              uv run --locked python -B integration/verify_endpoint_joint_pawl.py --manifest "$RUNNER_TEMP/razr-endpoint-joint/manifest.json" --output "$RUNNER_TEMP/razr-endpoint-joint/verification.json"
              uv run --locked python -B integration/roof_joint_budget.py --inputs integration/roof_joint_load_inputs.json --output "$RUNNER_TEMP/razr-endpoint-joint/load-budget.json"
          - id: catalogue-joint
            commands: |
              uv run --locked python -B integration/endpoint_joint_pawl.py --output "$RUNNER_TEMP/razr-catalogue-baseline"
              uv run --locked python -B integration/catalogue_roof_joint.py --baseline "$RUNNER_TEMP/razr-catalogue-baseline/manifest.json" --output "$RUNNER_TEMP/razr-catalogue"
              uv run --locked python -B integration/verify_catalogue_roof_joint.py --baseline "$RUNNER_TEMP/razr-catalogue-baseline/manifest.json" --manifest "$RUNNER_TEMP/razr-catalogue/manifest.json" --output "$RUNNER_TEMP/razr-catalogue/verification.json" --full
          - id: root-clearance
            commands: |
              uv run --locked python -B integration/endpoint_joint_pawl.py --output "$RUNNER_TEMP/razr-clearance-endpoint"
              uv run --locked python -B integration/catalogue_roof_joint.py --baseline "$RUNNER_TEMP/razr-clearance-endpoint/manifest.json" --output "$RUNNER_TEMP/razr-clearance-catalogue"
              uv run --locked python -B integration/root_clearance.py --baseline "$RUNNER_TEMP/razr-clearance-catalogue/manifest.json" --output "$RUNNER_TEMP/razr-root-clearance"
              uv run --locked python -B integration/verify_root_clearance.py --baseline "$RUNNER_TEMP/razr-clearance-catalogue/manifest.json" --manifest "$RUNNER_TEMP/razr-root-clearance/manifest.json" --output "$RUNNER_TEMP/razr-root-clearance/verification.json" --full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/blobs/
            !/baselines/**
            /baselines/**/*.py
            /baselines/**/*.md
            /baselines/**/*.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked research dependencies
        run: uv sync --locked
      - name: Verify interpreter and every locked package version
        run: uv run --locked python -B tools/check_environment.py
      - name: Generate and independently reread this native study
        run: ${{ matrix.commands }}
      - name: Preserve this study including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-native-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-*
          if-no-files-found: warn
          retention-days: 14

  product-native:
    name: native-product-ep4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/blobs/
            !/baselines/**
            /baselines/**/*.py
            /baselines/**/*.md
            /baselines/**/*.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked research dependencies
        run: uv sync --locked
      - name: Verify interpreter and every locked package version
        run: uv run --locked python -B tools/check_environment.py
      - name: Execute all finite product scenes and independent STEP readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --locked python -B tools/verify_product_native.py
          --expected-head "$EXPECTED_HEAD"
          --output "$RUNNER_TEMP/razr-product-native"
          --timeout-seconds 1200
      - name: Preserve product evidence including geometric rejection and execution failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-product-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-product-native
          if-no-files-found: warn
          retention-days: 14

  product-native-ep5:
    name: native-product-ep5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/blobs/
            !/baselines/**
            /baselines/**/*.py
            /baselines/**/*.md
            /baselines/**/*.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked research dependencies
        run: uv sync --locked
      - name: Verify interpreter and every locked package version
        run: uv run --locked python -B tools/check_environment.py
      - name: Execute local and complete EP5 scenes with independent STEP readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --locked python -B tools/verify_product_ep5_native.py
          --expected-head "$EXPECTED_HEAD"
          --output "$RUNNER_TEMP/razr-product-ep5-native"
          --timeout-seconds 3000
      - name: Preserve product evidence including geometric rejection and execution failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-product-ep5-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-product-ep5-native
          if-no-files-found: warn
          retention-days: 14

  product-nominal-controls:
    name: native-product-controls-${{ matrix.pose }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pose: [STOW, PREDOCK, OPEN]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/blobs/
            !/baselines/**
            /baselines/**/*.py
            /baselines/**/*.md
            /baselines/**/*.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked research dependencies
        run: uv sync --locked
      - name: Verify interpreter and every locked package version
        run: >-
          uv run --locked python -B tools/check_environment.py
          --output "$RUNNER_TEMP/razr-controls-environment.json"
      - name: Check the complete declared control and telescope domain
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CONTROL_POSE: ${{ matrix.pose }}
        run: >-
          uv run --locked python -B integration/product_nominal_motion.py
          --pose "$CONTROL_POSE" --expected-head "$EXPECTED_HEAD"
          --output "$RUNNER_TEMP/razr-controls.json"
      - name: Require the bounded geometric clearance to remain established
        env:
          CONTROL_REPORT: ${{ runner.temp }}/razr-controls.json
          CONTROL_POSE: ${{ matrix.pose }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --locked python -B tools/validate_product_nominal_report.py
          --report "$CONTROL_REPORT" --pose "$CONTROL_POSE" --expected-head "$EXPECTED_HEAD"
      - name: Preserve continuous control evidence including all failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-product-controls-${{ matrix.pose }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/razr-controls*.json
          if-no-files-found: warn
          retention-days: 14


  current-suites:
    name: current-suites
    if: always()
    needs: [unit, native, product-native, product-native-ep5, product-nominal-controls]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require all independent checks to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PRODUCT_NATIVE_RESULT: ${{ needs['product-native'].result }}
          PRODUCT_EP5_RESULT: ${{ needs['product-native-ep5'].result }}
          PRODUCT_CONTROLS_RESULT: ${{ needs['product-nominal-controls'].result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$PRODUCT_NATIVE_RESULT" = success
          test "$PRODUCT_EP5_RESULT" = success
          test "$PRODUCT_CONTROLS_RESULT" = success

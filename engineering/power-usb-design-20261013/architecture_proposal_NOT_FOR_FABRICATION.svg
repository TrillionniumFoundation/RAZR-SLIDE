<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-label="Discharge architecture and separate charging routes, research only"><rect width="1120" height="820" fill="#f6f8fb" /><text x="28" y="33" font-family="sans-serif" font-size="22" fill="#10243a">RAZR SLIDE — NODE ARCHITECTURE PROPOSAL</text><text x="28" y="59" font-family="sans-serif" font-size="15" fill="#a52929">NOT FOR FABRICATION · PCB / cells / OEM interfaces / USB rate unselected · manufacturing_go=false</text><rect x="30" y="90" width="200" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="42" y="115" font-family="sans-serif" font-size="16" fill="#10243a">A pack module</text><text x="42" y="139" font-family="sans-serif" font-size="13" fill="#10243a">CELL_P/N stay inside</text><text x="42" y="160" font-family="sans-serif" font-size="13" fill="#10243a">BMS + fuse: unspecified</text><text x="42" y="181" font-family="sans-serif" font-size="13" fill="#10243a">external PACK_P/PACK_N</text><rect x="265" y="90" width="245" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="277" y="115" font-family="sans-serif" font-size="16" fill="#10243a">A independent source cuts</text><text x="277" y="139" font-family="sans-serif" font-size="13" fill="#10243a">U_A1 → A_MID_P → U_A2</text><text x="277" y="160" font-family="sans-serif" font-size="13" fill="#10243a">default OFF, separate controls</text><text x="277" y="181" font-family="sans-serif" font-size="13" fill="#10243a">TPS259470L conditional only</text><rect x="545" y="90" width="205" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="557" y="115" font-family="sans-serif" font-size="16" fill="#10243a">Continuous power cable</text><text x="557" y="139" font-family="sans-serif" font-size="13" fill="#10243a">A_TX_P → A_RX_P</text><text x="557" y="160" font-family="sans-serif" font-size="13" fill="#10243a">dedicated protected return</text><text x="557" y="181" font-family="sans-serif" font-size="13" fill="#10243a">static terminations, no dock</text><rect x="785" y="90" width="295" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="797" y="115" font-family="sans-serif" font-size="16" fill="#10243a">B receiver cut / common rail</text><text x="797" y="139" font-family="sans-serif" font-size="13" fill="#10243a">U_ARX: A_RX_P → SYS_B_P</text><text x="797" y="160" font-family="sans-serif" font-size="13" fill="#10243a">always reverse-blocking candidate</text><text x="797" y="181" font-family="sans-serif" font-size="13" fill="#10243a">never a raw pack charging route</text><polyline points="230,141 265,141" fill="none" stroke="#16697a" stroke-width="2" /><text x="231" y="127" font-family="sans-serif" font-size="12" fill="#16697a">A_PACK_P</text><polyline points="510,141 545,141" fill="none" stroke="#16697a" stroke-width="2" /><text x="511" y="127" font-family="sans-serif" font-size="12" fill="#16697a">A_TX_P</text><polyline points="750,141 785,141" fill="none" stroke="#16697a" stroke-width="2" /><text x="751" y="127" font-family="sans-serif" font-size="12" fill="#16697a">A_RX_P</text><rect x="30" y="245" width="200" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="42" y="270" font-family="sans-serif" font-size="16" fill="#10243a">B pack module</text><text x="42" y="294" font-family="sans-serif" font-size="13" fill="#10243a">CELL_P/N stay inside</text><text x="42" y="315" font-family="sans-serif" font-size="13" fill="#10243a">own BMS + fuse unspecified</text><text x="42" y="336" font-family="sans-serif" font-size="13" fill="#10243a">external PACK_P/PACK_N</text><rect x="265" y="245" width="245" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="277" y="270" font-family="sans-serif" font-size="16" fill="#10243a">B local discharge cuts</text><text x="277" y="294" font-family="sans-serif" font-size="13" fill="#10243a">U_B1 → B_MID_P → U_B2</text><text x="277" y="315" font-family="sans-serif" font-size="13" fill="#10243a">no direct A/B CELL_P tie</text><text x="277" y="336" font-family="sans-serif" font-size="13" fill="#10243a">independent controls unbuilt</text><rect x="785" y="245" width="295" height="102" fill="#ffffff" stroke="#41607e" rx="8" /><text x="797" y="270" font-family="sans-serif" font-size="16" fill="#10243a">SYS_B_P load rail</text><text x="797" y="294" font-family="sans-serif" font-size="13" fill="#10243a">OEM input pinout: NULL</text><text x="797" y="315" font-family="sans-serif" font-size="13" fill="#10243a">load / voltage / fault energy: NULL</text><text x="797" y="336" font-family="sans-serif" font-size="13" fill="#10243a">voltage sensing and bleed: NULL</text><polyline points="230,296 265,296" fill="none" stroke="#16697a" stroke-width="2" /><text x="231" y="282" font-family="sans-serif" font-size="12" fill="#16697a">B_PACK_P</text><polyline points="510,296 785,296" fill="none" stroke="#16697a" stroke-width="2" /><text x="525" y="282" font-family="sans-serif" font-size="12" fill="#16697a">SYS_B_P (protected discharge)</text><polyline points="925,192 925,245" fill="none" stroke="#16697a" stroke-width="2" /><text x="937" y="224" font-family="sans-serif" font-size="12" fill="#16697a">SYS_B_P</text><text x="30" y="383" font-family="sans-serif" font-size="15" fill="#a52929">RETURN WARNING: PACK_N bonds to protected system reference; CELL_N must not bypass pack protection.</text><text x="30" y="408" font-family="sans-serif" font-size="13" fill="#a52929">Open dedicated return can divert load current into charge/USB/signal returns. Local imbalance trip → U_A2 is unbuilt.</text><rect x="30" y="449" width="1050" height="118" fill="#ffffff" stroke="#41607e" rx="8" /><text x="42" y="474" font-family="sans-serif" font-size="16" fill="#10243a">Separate charge net chain — not a completed charger schematic</text><text x="42" y="498" font-family="sans-serif" font-size="13" fill="#10243a">USB_VBUS_PORT → U_VBUS sink cut → CHARGE_BUS_B</text><text x="42" y="519" font-family="sans-serif" font-size="13" fill="#10243a">B: CHARGE_BUS_B → independent B charger → B_PACK_P/PACK_N; charger SYS stays local</text><text x="42" y="540" font-family="sans-serif" font-size="13" fill="#10243a">A: CHARGE_BUS_B → U_CHA_TX → separate H_CHARGE_A → U_CHA_RX → A charger → A_PACK_P/PACK_N</text><text x="42" y="561" font-family="sans-serif" font-size="13" fill="#10243a">Each charger/OTG/USB policy and supporting passives remain NULL; no charger SYS direct tie to common rail.</text><rect x="30" y="595" width="1050" height="95" fill="#ffffff" stroke="#41607e" rx="8" /><text x="42" y="620" font-family="sans-serif" font-size="16" fill="#10243a">Full-motion USB and signal remain separate</text><text x="42" y="644" font-family="sans-serif" font-size="13" fill="#10243a">H_USB: actual rate, pair count, shield/reference and connector pinout NULL; no normal-motion disconnect</text><text x="42" y="665" font-family="sans-serif" font-size="13" fill="#10243a">Conditional USB2 screen: incoming D+/D- → TMUXHS221F common pins 1/2; host → D1 pins 5/4</text><text x="42" y="686" font-family="sans-serif" font-size="13" fill="#10243a">Sustained OVP is side-specific. USB3/4 and assembled eye/BER/ESD are not qualified.</text><rect x="30" y="714" width="1050" height="78" fill="#fff2e8" stroke="#41607e" rx="8" /><text x="42" y="739" font-family="sans-serif" font-size="16" fill="#10243a">Physical release blocker</text><text x="42" y="763" font-family="sans-serif" font-size="13" fill="#10243a">All raw-rail zone coordinates, PCB clearances, creepage, fuse coordination, cable dielectric/fatigue and fault tests NULL.</text><text x="42" y="784" font-family="sans-serif" font-size="13" fill="#10243a">Source and receiver cuts do not close a direct raw-rail PCB bypass without actual physical separation and test evidence.</text></svg>